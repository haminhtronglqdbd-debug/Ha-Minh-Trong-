        closeEditModal: () => {
            document.getElementById('edit-question-modal').classList.remove('active');
            AppState.currentEditingIndex = null;
            AppState.currentEditingImage = null;
        },

        removeEditImage: () => {
            AppState.currentEditingImage = null;
            const previewContainer = document.getElementById('edit-img-preview-container');
            const previewImg = document.getElementById('edit-img-preview');
            previewImg.src = '';
            previewContainer.classList.add('hidden');
            previewContainer.classList.remove('flex');
        },

        handleImageUpload: (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                compressImage(e.target.result, 900, (compressedUrl) => {
                    AppState.currentEditingImage = compressedUrl;
                    const previewContainer = document.getElementById('edit-img-preview-container');
                    const previewImg = document.getElementById('edit-img-preview');
                    previewImg.src = compressedUrl;
                    previewContainer.classList.remove('hidden');
                    previewContainer.classList.add('flex');
                });
            };
            reader.readAsDataURL(file);
        },

        saveQuestionEdit: () => {
            const idx = AppState.currentEditingIndex;
            if (idx === null) return;

            const qs = getStoredQuestions();
            const q = qs[idx];
            if (!q) return;

            q.text = document.getElementById('edit-q-text').value.trim();
            q.explain = document.getElementById('edit-q-explain').value.trim();
            q.image = AppState.currentEditingImage || null;

            if (q.type === 'MC') {
                q.options = [0, 1, 2, 3].map(i => document.getElementById(`edit_opt_${i}`).value.trim());
                const selRadio = document.querySelector('input[name="edit_mc_correct"]:checked');
                if (selRadio) q.correct = parseInt(selRadio.value, 10);
            } else if (q.type === 'SHORT_ANS') {
                const ansStr = document.getElementById('edit_short_ans').value.trim().replace(',', '.');
                const numVal = parseFloat(ansStr);
                q.correct = !isNaN(numVal) ? numVal : ansStr;
            } else if (q.type === 'TF_CLUSTER') {
                q.statements.forEach((st, si) => {
                    st.text = document.getElementById(`edit_tf_text_${si}`).value.trim();
                    const selRadio = document.querySelector(`input[name="edit_tf_val_${si}"]:checked`);
                    st.correct = selRadio ? selRadio.value === 'T' : st.correct;
                });
            } else if (q.type === 'MATCH') {
                q.pairs.forEach((p, pi) => {
                    p.left = document.getElementById(`edit_match_l_${pi}`).value.trim();
                    p.right = document.getElementById(`edit_match_r_${pi}`).value.trim();
                });
            } else if (q.type === 'FILL_BLANK') {
                const wordsStr = document.getElementById('edit_fb_words').value.trim();
                q.words = wordsStr.split(',').map(w => w.trim()).filter(w => w.length > 0);
            }

            qs[idx] = q;
            saveStoredQuestions(qs);
            App.closeEditModal();
            App.render();
            safeMathJax();
            App.showToast(`✅ Đã lưu thành công nội dung Câu ${idx + 1}!`);
        },

        saveSingleExamInline: (idx) => {
            const qs = getStoredQuestions();
            const q = qs[idx];
            if (!q) return;

            const textEl = document.getElementById(`inline-q-text-${idx}`);
            const expEl = document.getElementById(`inline-q-explain-${idx}`);
            if (textEl) q.text = textEl.value.trim();
            if (expEl) q.explain = expEl.value.trim();

            if (q.type === 'MC') {
                q.options = [0, 1, 2, 3].map(oi => {
                    const optEl = document.getElementById(`inline-opt-${idx}-${oi}`);
                    return optEl ? optEl.value.trim() : q.options[oi];
                });
                const sel = document.querySelector(`input[name="inline_mc_correct_${idx}"]:checked`);
                if (sel) q.correct = parseInt(sel.value, 10);
            } else if (q.type === 'SHORT_ANS') {
                const ansEl = document.getElementById(`inline-short-ans-${idx}`);
                if (ansEl) {
                    const valStr = ansEl.value.trim().replace(',', '.');
                    const num = parseFloat(valStr);
                    q.correct = !isNaN(num) ? num : valStr;
                }
            } else if (q.type === 'TF_CLUSTER') {
                q.statements.forEach((st, si) => {
                    const stEl = document.getElementById(`inline-tf-text-${idx}-${si}`);
                    if (stEl) st.text = stEl.value.trim();
                    const sel = document.querySelector(`input[name="inline_tf_val_${idx}_${si}"]:checked`);
                    if (sel) st.correct = sel.value === 'T';
                });
            } else if (q.type === 'MATCH') {
                q.pairs.forEach((p, pi) => {
                    const lEl = document.getElementById(`inline-match-l-${idx}-${pi}`);
                    const rEl = document.getElementById(`inline-match-r-${idx}-${pi}`);
                    if (lEl) p.left = lEl.value.trim();
                    if (rEl) p.right = rEl.value.trim();
                });
            } else if (q.type === 'FILL_BLANK') {
                const wEl = document.getElementById(`inline-fb-words-${idx}`);
                if (wEl) {
                    q.words = wEl.value.split(',').map(w => w.trim()).filter(w => w.length > 0);
                }
            }

            qs[idx] = q;
            saveStoredQuestions(qs);
            App.showToast(`✅ Đã lưu thành công Câu ${idx + 1}!`);
        },

        saveAllExamInline: () => {
            const qs = getStoredQuestions();
            qs.forEach((q, idx) => {
                const textEl = document.getElementById(`inline-q-text-${idx}`);
                const expEl = document.getElementById(`inline-q-explain-${idx}`);
                if (textEl) q.text = textEl.value.trim();
                if (expEl) q.explain = expEl.value.trim();

                if (q.type === 'MC') {
                    q.options = [0, 1, 2, 3].map(oi => {
                        const optEl = document.getElementById(`inline-opt-${idx}-${oi}`);
                        return optEl ? optEl.value.trim() : q.options[oi];
                    });
                    const sel = document.querySelector(`input[name="inline_mc_correct_${idx}"]:checked`);
                    if (sel) q.correct = parseInt(sel.value, 10);
                } else if (q.type === 'SHORT_ANS') {
                    const ansEl = document.getElementById(`inline-short-ans-${idx}`);
                    if (ansEl) {
                        const valStr = ansEl.value.trim().replace(',', '.');
                        const num = parseFloat(valStr);
                        q.correct = !isNaN(num) ? num : valStr;
                    }
                } else if (q.type === 'TF_CLUSTER') {
                    q.statements.forEach((st, si) => {
                        const stEl = document.getElementById(`inline-tf-text-${idx}-${si}`);
                        if (stEl) st.text = stEl.value.trim();
                        const sel = document.querySelector(`input[name="inline_tf_val_${idx}_${si}"]:checked`);
                        if (sel) st.correct = sel.value === 'T';
                    });
                } else if (q.type === 'MATCH') {
                    q.pairs.forEach((p, pi) => {
                        const lEl = document.getElementById(`inline-match-l-${idx}-${pi}`);
                        const rEl = document.getElementById(`inline-match-r-${idx}-${pi}`);
                        if (lEl) p.left = lEl.value.trim();
                        if (rEl) p.right = rEl.value.trim();
                    });
                } else if (q.type === 'FILL_BLANK') {
                    const wEl = document.getElementById(`inline-fb-words-${idx}`);
                    if (wEl) {
                        q.words = wEl.value.split(',').map(w => w.trim()).filter(w => w.length > 0);
                    }
                }
            });

            saveStoredQuestions(qs);
            App.showToast(`🎉 Đã lưu toàn bộ đề thi thành công! Học sinh vào làm sẽ nhận ngay đề mới.`);
            playSound(true);
        },

        removeInlineImage: (idx) => {
            const qs = getStoredQuestions();
            if (qs[idx]) {
                qs[idx].image = null;
                saveStoredQuestions(qs);
                App.render();
                App.showToast(`🗑️ Đã gỡ ảnh câu ${idx + 1}!`);
            }
        },

        showToast: (msg) => {
            const toast = document.getElementById('toast-notify');
            if (!toast) return;
            toast.innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
            }, 3000);
        },

        confirmResetQuestions: () => {
            MODAL.show(
                'Khôi Phục Đề Gốc',
                'Bạn có chắc chắn muốn đặt lại toàn bộ 25 câu hỏi về nội dung mặc định của SGK Bài 1? Các ảnh và câu chỉnh sửa sẽ được khôi phục nguyên bản.',
                () => {
                    localStorage.removeItem('vatli10_b1_questions');
                    MODAL.hide();
                    App.render();
                    safeMathJax();
                },
                true
            );
        }
    };

    // Lắng nghe sự kiện Ctrl + V để dán ảnh vào Modal
    window.addEventListener('paste', (e) => {
        const editModal = document.getElementById('edit-question-modal');
        if (!editModal || !editModal.classList.contains('active')) return;

        const items = (e.clipboardData || e.originalEvent.clipboardData).items;
        for (let i = 0; i < items.length; i++) {
            if (items[i].type.indexOf('image') !== -1) {
                const blob = items[i].getAsFile();
                const reader = new FileReader();
                reader.onload = (event) => {
                    compressImage(event.target.result, 900, (compressedUrl) => {
                        AppState.currentEditingImage = compressedUrl;
                        const previewContainer = document.getElementById('edit-img-preview-container');
                        const previewImg = document.getElementById('edit-img-preview');
                        previewImg.src = compressedUrl;
                        previewContainer.classList.remove('hidden');
                        previewContainer.classList.add('flex');
                    });
                };
                reader.readAsDataURL(blob);
                break;
            }
        }
    });

    // Phím tắt Ctrl + S (hoặc Cmd + S trên Mac) để lưu nhanh khi đang sửa câu hỏi
    window.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
            const editModal = document.getElementById('edit-question-modal');
            if (editModal && editModal.classList.contains('active')) {
                e.preventDefault();
                App.saveQuestionEdit();
            }
        }
    });

    // Lắng nghe đồng bộ bảng điểm thời gian thực khi có bài nộp từ tab khác
    window.addEventListener('storage', (e) => {
        if (e.key === 'vatli10_b1_scores' && AppState.status === 'ADMIN') {
            App.render();
        }
    });

    // Khởi chạy ứng dụng
    App.render();
</script>
