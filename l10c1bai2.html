<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập Tương Tác - An Toàn Phòng Thực Hành Vật Lí</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tone.js cho Âm thanh (Phiên bản ổn định) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- Cấu hình MathJax Tối ưu chống lag -->
    <script>
        window.MathJax = {
            startup: { typeset: false },
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-svg.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f0fdf4; 
            color: #0f172a; 
            overflow-x: hidden; 
        }
        
        .glass-panel { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255, 255, 255, 0.5); 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); 
        }
        
        /* CTM (Click-to-match) & Drag Drop UI */
        .ctm-target { 
            display: inline-flex; align-items: center; justify-content: center; 
            min-width: 120px; min-height: 40px; padding: 4px 14px; margin: 4px 6px;
            border: 2px dashed #94a3b8; border-radius: 8px; 
            background-color: #f1f5f9; color: #16a34a; font-weight: 700;
            cursor: pointer; vertical-align: middle; transition: all 0.2s;
            box-sizing: border-box; line-height: 1.2; word-break: break-word;
        }
        .ctm-target:hover { border-color: #22c55e; background-color: #dcfce7; }
        .ctm-target.filled { 
            border-style: solid; border-color: #16a34a; background-color: #bbf7d0; 
            box-shadow: 0 2px 4px rgba(22, 163, 74, 0.2); 
        }
        
        .ctm-source {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 10px 20px; margin: 6px; border-radius: 9999px;
            background-color: #dcfce7; color: #166534; font-weight: 700; border: 2px solid transparent;
            cursor: pointer; transition: all 0.2s; user-select: none; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .ctm-source:hover:not(.used) { background-color: #bbf7d0; transform: translateY(-3px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .ctm-source.active { border-color: #15803d; background-color: #bbf7d0; box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.3); transform: scale(1.05); }
        .ctm-source.used { opacity: 0.3; cursor: not-allowed; transform: none; background-color: #f1f5f9; color: #94a3b8; box-shadow: none; }
        
        /* Ngăn MathJax cản trở sự kiện click trong kéo thả */
        .ctm-source mjx-container, .ctm-target mjx-container { pointer-events: none; }
        
        /* Chống vỡ layout do MathJax */
        mjx-container { display: inline-block !important; }
        mjx-container svg { display: inline-block !important; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Modal Custom thay thế alert/confirm */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center; z-index: 9999;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content { transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .modal-overlay.active .modal-content { transform: scale(1); }

        /* Animation */
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .animate-popIn { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>
</head>
<body>

    <!-- Vùng chứa giao diện -->
    <div id="app-root" class="min-h-screen w-full flex flex-col bg-[url('https://www.transparenttextures.com/patterns/connected.png')]"></div>

    <script type="module">
        const QUESTION_BANK = [
            // --- DẠNG 1: TRẮC NGHIỆM (10 CÂU) ---
            { type: 'MC', q: 'Theo Bảng 2.1, kí hiệu "DC hoặc dấu -" trên thiết bị điện có ý nghĩa là gì?', opts: ['Dòng điện xoay chiều', 'Dòng điện một chiều', 'Đầu vào (Input)', 'Đầu ra (Output)'], ans: 1, exp: 'Theo Bảng 2.1 trang 13 SGK, kí hiệu DC hoặc dấu "-" biểu thị dòng điện một chiều.' },
            { type: 'MC', q: 'Trên thiết bị đo điện, nếu bạn nhìn thấy kí hiệu dấu "~", nó cảnh báo thiết bị này sử dụng:', opts: ['Dòng điện một chiều', 'Nguồn pin', 'Dòng điện xoay chiều', 'Bình khí nén'], ans: 2, exp: 'Dấu "~" hoặc AC là kí hiệu của dòng điện xoay chiều (Bảng 2.1 trang 13).' },
            { type: 'MC', q: 'Hình ảnh cảnh báo "Đầu lâu xương chéo" trong phòng thực hành có ý nghĩa gì?', opts: ['Chất dễ cháy', 'Nơi nguy hiểm về điện', 'Chất độc sức khoẻ', 'Chất ăn mòn'], ans: 2, exp: 'Theo Hình 2.8 trang 16, biểu tượng đầu lâu xương chéo cảnh báo "Chất độc sức khoẻ".' },
            { type: 'MC', q: 'Khi phòng thực hành có đám cháy, việc ĐẦU TIÊN cần làm theo lưu ý của SGK là gì?', opts: ['Đưa hóa chất ra ngoài', 'Dùng nước dập lửa ngay', 'Ngắt toàn bộ hệ thống điện', 'Dùng bình $CO_2$ xịt vào tủ điện'], ans: 2, exp: 'Theo mục 3 trang 15, lưu ý đầu tiên khi có đám cháy là phải "Ngắt toàn bộ hệ thống điện".' },
            { type: 'MC', q: 'Tại sao KHÔNG được sử dụng nước để dập đám cháy nơi có thiết bị điện hoặc đám cháy hydrocarbon (dầu, cồn)?', opts: ['Vì nước làm hỏng thiết bị điện', 'Vì nước có tỉ trọng nặng hơn sẽ làm chất lỏng nhẹ nổi lên và cháy lan, đồng thời nước dẫn điện', 'Vì nước bốc hơi làm giảm tầm nhìn', 'Vì nước làm giảm nhiệt độ quá nhanh'], ans: 1, exp: 'Theo SGK trang 15, không dùng nước dập cháy thiết bị điện (nguy cơ giật) và cháy chất lỏng có tỉ trọng nhẹ hơn nước (như dầu, cồn) vì chúng sẽ nổi lên mặt nước và lan rộng.' },
            { type: 'MC', q: 'Tuyệt đối KHÔNG được dùng bình chữa cháy sinh khí $CO_2$ để dập tắt đám cháy nào sau đây?', opts: ['Cháy bảng điện', 'Cháy quần áo trên người hoặc kim loại kiềm như Magnesium', 'Cháy thùng rác chứa giấy', 'Cháy cồn y tế'], ans: 1, exp: 'Theo trang 15 SGK, không dùng $CO_2$ dập cháy quần áo trên người hoặc kim loại kiềm (như Magnesium) vì phản ứng có thể làm đám cháy nguy hiểm hơn.' },
            { type: 'MC', q: 'Khi sử dụng đồng hồ đo điện đa năng để đo dòng điện, thao tác nào sau đây là sai?', opts: ['Chọn chức năng đo dòng điện (A hoặc mA)', 'Chọn thang đo nhỏ nhất trước để kim dễ hiển thị', 'Chọn thang đo lớn nhất rồi giảm dần để không vượt quá giới hạn đo', 'Cắm đúng chốt cắm phù hợp với chức năng đo'], ans: 1, exp: 'Theo trang 14 SGK, khi chưa biết rõ giá trị, phải chọn thang đo LỚN NHẤT để tránh làm hỏng thiết bị, sau đó mới giảm dần.' },
            { type: 'MC', q: 'Tổn thương cơ thể do dòng điện chạy qua người được gọi là gì?', opts: ['Đoản mạch', 'Tĩnh điện', 'Sốc điện (hay điện giật)', 'Cảm ứng điện từ'], ans: 2, exp: 'Theo phần Em có biết trang 16, hiện tượng dòng điện chạy qua người gây tổn thương được gọi là Sốc điện (điện giật).' },
            { type: 'MC', q: 'Kí hiệu hai mũi tên thẳng đứng ($\\uparrow \\uparrow$) in trên vỏ hộp thiết bị có ý nghĩa gì?', opts: ['Dụng cụ đặt đứng', 'Tránh ánh nắng trực tiếp', 'Dụng cụ dễ vỡ', 'Tăng điện áp'], ans: 0, exp: 'Theo Bảng 2.1 trang 13, kí hiệu $\\uparrow \\uparrow$ có nghĩa là dụng cụ phải được đặt đứng.' },
            { type: 'MC', q: 'Theo quy tắc an toàn, trước khi cắm hoặc tháo thiết bị điện, công tắc nguồn thiết bị phải ở trạng thái nào?', opts: ['Bật (ON)', 'Tắt (OFF)', 'Chế độ chờ (Standby)', 'Không quan trọng'], ans: 1, exp: 'Theo quy tắc trang 16: "Tắt công tắc nguồn thiết bị điện trước khi cắm hoặc tháo thiết bị điện".' },

            // --- DẠNG 2: ĐIỀN KHUYẾT (5 CÂU) ---
            { type: 'FIB', q: 'Để đảm bảo an toàn cho thiết bị đo điện, không được để dòng điện vượt quá ........ của ampe kế. (Gợi ý: 3 từ)', ans: 'giới hạn đo', exp: 'Theo trang 14 SGK: "Không nhầm lẫn khi thao tác để đảm bảo an toàn... Nếu sử dụng ampe kế đo dòng điện vượt quá giới hạn đo thì có thể gây ra nguy cơ hỏng thiết bị."' },
            { type: 'FIB', q: 'Kí hiệu chiếc cốc thủy tinh bị nứt có ý nghĩa là dụng cụ ........ (Gợi ý: 2 từ)', ans: 'dễ vỡ', exp: 'Dựa vào Bảng 2.1 trang 13, kí hiệu ly thủy tinh nứt mang ý nghĩa "Dụng cụ dễ vỡ".' },
            { type: 'FIB', q: 'Khi sử dụng các thiết bị đun nóng (như đèn cồn, bình thủy tinh chịu nhiệt), nguy cơ lớn nhất có thể gây ra cho người sử dụng là bị ........ (Gợi ý: 1 từ)', ans: 'bỏng', exp: 'Theo mục 2 trang 13: "Các thiết bị đun nóng có thể gây bỏng với người sử dụng."' },
            { type: 'FIB', q: 'Khi phát hiện người bị điện giật, việc đầu tiên cần làm là nhanh chóng ........ nguồn điện. (Gợi ý: 1 từ)', ans: 'ngắt', exp: 'Theo lưu ý trang 16: "Khi phát hiện người bị điện giật cần nhanh chóng ngắt nguồn điện..."' },
            { type: 'FIB', q: 'Việc thực hiện sai thao tác sử dụng thiết bị (ví dụ: rút phích cắm bằng cách kéo dây, dây điện bị sờn) có thể dẫn đến nguy cơ mất ........ (Gợi ý: 2 từ)', ans: 'an toàn', exp: 'Theo mục II.1 trang 14, các thao tác này gây ra "Nguy cơ mất an toàn trong sử dụng thiết bị thí nghiệm".' },

            // --- DẠNG 3: GHÉP NỐI (5 CÂU) ---
            { type: 'MATCH', q: 'Ghép nối kí hiệu thiết bị ở Bảng 2.1 với mô tả chính xác:', pairs: [ { l: 'Input (I)', r: 'Đầu vào' }, { l: 'Output', r: 'Đầu ra' }, { l: 'Dấu "+" màu đỏ', r: 'Cực dương' }, { l: 'Dấu "-" màu xanh', r: 'Cực âm' } ], exp: 'Dựa vào dữ liệu chuẩn của Bảng 2.1 trang 13.' },
            { type: 'MATCH', q: 'Ghép thao tác sai với nguy cơ có thể xảy ra (Hình 2.4):', pairs: [ { l: 'Nắm vào dây điện để rút phích', r: 'Đứt ngầm, giật điện' }, { l: 'Dùng dây điện bị sờn vỏ', r: 'Hở mạch, rò rỉ điện' }, { l: 'Chiếu tia laser vào mắt', r: 'Tổn thương võng mạc' }, { l: 'Đun nước sôi không kẹp giữ', r: 'Đổ nước sôi gây bỏng' } ], exp: 'Đây là các phân tích từ Hình 2.4 trang 14 về nguy cơ gây nguy hiểm cho người sử dụng.' },
            { type: 'MATCH', q: 'Ghép biển cảnh báo với ý nghĩa (Hình 2.8):', pairs: [ { l: 'Cây chết, cá chết', r: 'Chất độc môi trường' }, { l: 'Tia chớp nền vàng', r: 'Nơi nguy hiểm về điện' }, { l: 'Hình ngọn lửa', r: 'Chất dễ cháy' }, { l: 'Cánh quạt 3 cánh nền vàng', r: 'Nơi có chất phóng xạ' } ], exp: 'Theo Hình 2.8 "Các biển báo trong phòng thí nghiệm" trang 16.' },
            { type: 'MATCH', q: 'Xử lý tình huống cháy phòng thực hành (Trang 15):', pairs: [ { l: 'Đám cháy do điện', r: 'Không được dùng nước' }, { l: 'Đám cháy xăng, dầu', r: 'Không dùng nước vì chất lỏng nhẹ sẽ nổi' }, { l: 'Cháy quần áo trên người', r: 'Không dùng bình sinh khí $CO_2$' } ], exp: 'Dựa vào danh sách các lưu ý xử lý đám cháy ở cột bên phải trang 15.' },
            { type: 'MATCH', q: 'Quy tắc an toàn thiết bị đo điện (Trang 14):', pairs: [ { l: 'Chọn thang đo', r: 'Chọn mức cao nhất rồi giảm dần' }, { l: 'Cắm chốt đo', r: 'Phù hợp với chức năng (V, A, $\\Omega$)' }, { l: 'Giới hạn đo', r: 'Không được vượt quá để tránh hỏng thiết bị' } ], exp: 'Đây là các bước cơ bản để không làm hỏng đồng hồ đo điện đa năng hay ampe kế.' },

            // --- DẠNG 4: KÉO THẢ (5 CÂU) ---
            { type: 'DD', q: 'Quy tắc dập tắt đám cháy (Trang 15):', text: 'Không được sử dụng [0] để dập đám cháy nơi có thiết bị điện, hoặc đám cháy các chất lỏng có [1] nhẹ hơn nước như dầu, cồn. Không được sử dụng [2] để dập tắt đám cháy quần áo trên người hoặc cháy kim loại kiềm.', correct: {'0': 'nước', '1': 'tỉ trọng', '2': '$CO_2$'}, opts: ['nước', 'tỉ trọng', '$CO_2$', 'bình chữa cháy', 'nhiệt độ'], exp: 'Trích nguyên văn từ các lưu ý chữa cháy ở cột phải trang 15.' },
            { type: 'DD', q: 'Nguy cơ cháy nổ trong phòng thực hành:', text: 'Khi tiến hành thí nghiệm với các thiết bị [0] và những hóa chất, chất [1] trong phòng thực hành cần tuân thủ quy tắc an toàn, nhất là những quy tắc an toàn về [2] chữa cháy.', correct: {'0': 'điện', '1': 'dễ cháy', '2': 'phòng cháy'}, opts: ['điện', 'dễ cháy', 'phòng cháy', 'nhiệt độ', 'hóa học'], exp: 'Trích từ mục 3 "Nguy cơ cháy nổ..." trang 15 SGK.' },
            { type: 'DD', q: 'An toàn khi sử dụng thiết bị quang học (Trang 13):', text: 'Các thiết bị quang học rất dễ mốc, [0], nứt, vỡ và dính bụi bẩn, làm ảnh hưởng đến đường truyền [1] và làm [2] kết quả thí nghiệm.', correct: {'0': 'xước', '1': 'tia sáng', '2': 'sai lệch'}, opts: ['xước', 'tia sáng', 'sai lệch', 'đứt', 'hiệu điện thế'], exp: 'Theo mục 3 trang 13 về sử dụng thiết bị quang học.' },
            { type: 'DD', q: 'Sốc điện (Trang 16):', text: 'Sốc điện (hay [0]): Sốc điện xảy ra khi dòng điện chạy qua [1], có thể gây ra tổn thương các bộ phận của cơ thể hoặc [2].', correct: {'0': 'điện giật', '1': 'người', '2': 'tử vong'}, opts: ['điện giật', 'người', 'tử vong', 'thiết bị', 'chập cháy'], exp: 'Trích phần "Em có biết" mục 1 trang 16 SGK.' },
            { type: 'DD', q: 'Quy tắc an toàn chung (Trang 16):', text: 'Chỉ tiến hành thí nghiệm khi được sự [0] của giáo viên hướng dẫn. Tắt công tắc [1] thiết bị điện trước khi cắm hoặc tháo thiết bị. Chỉ cắm phích cắm vào ổ điện có [2] tương ứng với hiệu điện thế định mức.', correct: {'0': 'cho phép', '1': 'nguồn', '2': 'hiệu điện thế'}, opts: ['cho phép', 'nguồn', 'hiệu điện thế', 'bảo vệ', 'cường độ'], exp: 'Trích từ các gạch đầu dòng 3, 4, 5 trong phần III. Quy tắc an toàn trang 16.' }
        ];

        const state = {
            screen: 'LOGIN', // LOGIN, QUIZ, RESULT, ADMIN
            userType: null, // GROUP, INDIVIDUAL
            userName: '',
            
            questions: [], 
            currentQIndex: 0,
            score: 0,
            startTime: 0,
            timeSpentTotal: 0,
            
            timeLeft: 30,
            timerId: null,
            
            // State cho từng loại câu hỏi
            selectedMcOpt: null,
            fibAnswer: '',
            matchLeftSelected: null,
            matchPairs: {}, 
            ddActiveSource: null,
            ddAnswers: {}, 
            
            isAnswering: true,
            lastResult: false,
            
            // Lấy lịch sử từ LocalStorage
            history: JSON.parse(localStorage.getItem('physics_history_ch1_b2') || '[]'),
            
            adminTab: 'GROUP'
        };

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        let toneStarted = false;
        let isMusicPlaying = false; 
        let bgPart = null;

        async function playSound(type) {
            if (typeof Tone === 'undefined') return;
            try {
                if (!toneStarted) { await Tone.start(); toneStarted = true; }
                const synth = new Tone.Synth().toDestination();
                if (type === 'correct') {
                    synth.triggerAttackRelease("C5", "8n");
                    setTimeout(() => synth.triggerAttackRelease("E5", "8n"), 150);
                } else if (type === 'wrong') {
                    synth.triggerAttackRelease("G3", "8n");
                    setTimeout(() => synth.triggerAttackRelease("C3", "4n"), 150);
                }
            } catch(e) { console.warn("Lỗi phát âm thanh:", e); }
        }

        async function toggleMusic() {
            if (typeof Tone === 'undefined') return;
            try {
                if (!toneStarted) { await Tone.start(); toneStarted = true; }
                
                if (!bgPart) {
                    const bgSynth = new Tone.PolySynth(Tone.Synth, {
                        oscillator: { type: "triangle" },
                        envelope: { attack: 0.05, decay: 0.1, sustain: 0.2, release: 1 }
                    }).toDestination();
                    bgSynth.volume.value = -12; 
                    
                    const notes = [
                        ["0:0:0", "C5"], ["0:0:2", "G4"], ["0:1:0", "E4"],
                        ["0:1:3", "A4"], ["0:2:1", "B4"], ["0:2:3", "Bb4"], ["0:3:0", "A4"],
                        ["0:3:2", "G4"]
                    ];
                    bgPart = new Tone.Part((time, note) => {
                        bgSynth.triggerAttackRelease(note, "16n", time);
                    }, notes);
                    bgPart.loop = true;
                    bgPart.loopEnd = "1:0:0";
                    Tone.Transport.bpm.value = 140; 
                }

                const btn = document.getElementById('music-btn');
                if (isMusicPlaying) {
                    Tone.Transport.stop();
                    isMusicPlaying = false;
                    if(btn) btn.innerText = '🔇';
                } else {
                    Tone.Transport.start();
                    bgPart.start(0);
                    isMusicPlaying = true;
                    if(btn) btn.innerText = '🎵';
                }
            } catch(e) { console.warn("Lỗi nhạc nền:", e); }
        }

        function triggerConfetti() {
            if (typeof confetti !== 'undefined') {
                confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
            }
        }

        function triggerMathJax() {
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([document.getElementById('app-root')]).catch(err => console.error(err));
            }
        }

        // Tự code Modal thay thế alert/confirm
        function showModal(id) { document.getElementById(id).classList.add('active'); }
        function hideModal(id) { 
            document.getElementById(id).classList.remove('active'); 
            const inp = document.querySelector(`#${id} input[type="password"]`);
            if(inp) inp.value = '';
        }
        function alertMsg(title, body) {
            document.getElementById('msg-title').innerText = title;
            document.getElementById('msg-body').innerText = body;
            showModal('msg-modal');
        }
        function confirmMsg(title, body, onConfirm) {
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-body').innerText = body;
            document.getElementById('confirm-btn').onclick = () => {
                hideModal('confirm-modal');
                onConfirm();
            };
            showModal('confirm-modal');
        }

        const App = {
            render() {
                const root = document.getElementById('app-root');
                let html = '';
                
                if (state.screen === 'LOGIN') html = this.htmlLogin();
                else if (state.screen === 'QUIZ') html = this.htmlQuiz();
                else if (state.screen === 'RESULT') html = this.htmlResult();
                else if (state.screen === 'ADMIN') html = this.htmlAdmin();
                
                html += this.htmlModals();
                root.innerHTML = html;
                
                // Gọi MathJax sau mỗi lần DOM render để công thức hiện đẹp
                setTimeout(triggerMathJax, 10);
            },

            htmlLogin() {
                const tab = state.loginTab || 'GROUP';
                return `
                <button onclick="App.toggleMusic()" id="music-btn" class="fixed top-6 left-6 z-50 bg-white p-3 rounded-full shadow-lg text-2xl hover:scale-110 border border-green-200">🔇</button>

                <div class="flex-1 flex flex-col items-center justify-center p-4 relative z-10">
                    <div class="text-center mb-10">
                        <h1 class="text-5xl md:text-6xl font-black mb-4 text-green-800 drop-shadow-sm uppercase tracking-tight">An Toàn Thực Hành</h1>
                        <p class="text-xl font-bold text-green-700 bg-white px-6 py-2 rounded-full shadow-sm inline-block border border-green-200">Bài 2 - Vật Lí THPT</p>
                    </div>

                    <div class="glass-panel p-8 rounded-3xl w-full max-w-xl border-t-8 border-green-600">
                        <div class="flex border-b-2 border-slate-200 mb-8">
                            <button onclick="App.setLoginTab('GROUP')" class="flex-1 py-4 font-bold text-lg transition-all ${tab === 'GROUP' ? 'border-b-4 border-green-600 text-green-700' : 'text-slate-400 hover:text-slate-600'}">NHÓM</button>
                            <button onclick="App.setLoginTab('INDIV')" class="flex-1 py-4 font-bold text-lg transition-all ${tab === 'INDIV' ? 'border-b-4 border-green-600 text-green-700' : 'text-slate-400 hover:text-slate-600'}">CÁ NHÂN</button>
                        </div>
                        
                        ${tab === 'GROUP' ? `
                            <div class="space-y-5">
                                <div>
                                    <label class="block font-bold mb-2 text-slate-700">Chọn Nhóm</label>
                                    <select id="l-group" class="w-full p-4 border-2 border-slate-200 rounded-xl bg-slate-50 focus:border-green-500 outline-none font-semibold text-lg">
                                        ${[...Array(12)].map((_, i) => `<option value="${i+1}">Nhóm ${i+1}</option>`).join('')}
                                    </select>
                                </div>
                                <div>
                                    <label class="block font-bold mb-2 text-slate-700">Thành viên (cách bằng dấu phẩy)</label>
                                    <input type="text" id="l-members" class="w-full p-4 border-2 border-slate-200 rounded-xl bg-slate-50 focus:border-green-500 outline-none font-semibold text-lg" placeholder="VD: An, Bình, Châu">
                                </div>
                            </div>
                        ` : `
                            <div class="space-y-5">
                                <div>
                                    <label class="block font-bold mb-2 text-slate-700">Họ và Tên</label>
                                    <input type="text" id="l-name" class="w-full p-4 border-2 border-slate-200 rounded-xl bg-slate-50 focus:border-green-500 outline-none font-semibold text-lg" placeholder="Nhập họ tên...">
                                </div>
                                <div>
                                    <label class="block font-bold mb-2 text-slate-700">Mật khẩu</label>
                                    <input type="password" id="l-pass" class="w-full p-4 border-2 border-slate-200 rounded-xl bg-slate-50 focus:border-green-500 outline-none font-semibold text-lg text-center" placeholder="******">
                                </div>
                            </div>
                        `}
                        
                        <button onclick="App.startQuiz()" class="w-full mt-10 bg-green-600 hover:bg-green-700 text-white font-black py-5 rounded-2xl text-xl transition-all shadow-[0_8px_20px_rgba(22,163,74,0.3)] hover:scale-[1.02]">BẮT ĐẦU LÀM BÀI</button>
                    </div>

                    <div class="fixed bottom-6 right-6 flex gap-4">
                        <button onclick="showModal('mod-teacher')" class="px-5 py-3 bg-white text-slate-700 rounded-xl font-bold shadow-lg border border-slate-200">👨‍🏫 Quản lý</button>
                        <button onclick="showModal('mod-parent')" class="px-5 py-3 bg-white text-slate-700 rounded-xl font-bold shadow-lg border border-slate-200">👨‍👩‍👧 Phụ huynh</button>
                    </div>
                </div>
                `;
            },
            
            setLoginTab(t) { state.loginTab = t; this.render(); },
            toggleMusic() { toggleMusic(); },

            startQuiz() {
                if(isMusicPlaying) this.toggleMusic();

                const tab = state.loginTab || 'GROUP';
                if (tab === 'GROUP') {
                    const group = document.getElementById('l-group').value;
                    const mems = document.getElementById('l-members').value.trim();
                    const arr = mems.split(',').filter(x => x.trim() !== '');
                    if (arr.length < 2 || arr.length > 4) return alertMsg("Lỗi", "Vui lòng nhập 2-4 thành viên, cách nhau bằng dấu phẩy.");
                    state.userType = 'GROUP';
                    state.userName = `Nhóm ${group}: ${mems}`;
                } else {
                    const name = document.getElementById('l-name').value.trim();
                    const pass = document.getElementById('l-pass').value;
                    if (!name) return alertMsg("Lỗi", "Vui lòng nhập Họ Tên.");
                    if (pass !== '123456') return alertMsg("Lỗi", "Sai mật khẩu cá nhân.");
                    state.userType = 'INDIVIDUAL';
                    state.userName = name;
                }

                // Sao chép và xáo trộn câu hỏi
                let qs = JSON.parse(JSON.stringify(QUESTION_BANK));
                qs.forEach(q => {
                    if (q.type === 'MC') {
                        const correctText = q.opts[q.ans];
                        q.opts = shuffle([...q.opts]);
                        q.ans = q.opts.indexOf(correctText);
                    }
                });
                state.questions = shuffle(qs);
                state.currentQIndex = 0;
                state.score = 0;
                state.timeSpentTotal = 0;
                state.screen = 'QUIZ';
                
                this.setupQuestion();
                this.render();
            },

            setupQuestion() {
                state.isAnswering = true;
                state.timeLeft = 30;
                state.selectedMcOpt = null;
                state.fibAnswer = '';
                state.matchLeftSelected = null;
                state.matchPairs = {};
                state.ddActiveSource = null;
                state.ddAnswers = {};
                
                clearInterval(state.timerId);
                state.startTime = Date.now();
                
                state.timerId = setInterval(() => {
                    if (!state.isAnswering) { clearInterval(state.timerId); return; }
                    state.timeLeft--;
                    const tel = document.getElementById('ui-timer');
                    if (tel) {
                        tel.innerText = state.timeLeft;
                        if(state.timeLeft <= 5) tel.className = 'text-3xl font-mono text-red-500 animate-pulse';
                    }
                    if (state.timeLeft <= 0) {
                        clearInterval(state.timerId);
                        this.checkAnswer(true); 
                    }
                }, 1000);
            },

            htmlQuiz() {
                const q = state.questions[state.currentQIndex];
                const isLast = state.currentQIndex === state.questions.length - 1;
                
                return `
                <div class="flex-1 flex flex-col p-4 md:p-8 max-w-5xl mx-auto w-full relative z-10">
                    <div class="flex flex-wrap gap-4 justify-between items-center mb-6 bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                        <div class="text-xl font-black text-slate-700 bg-slate-100 px-4 py-2 rounded-lg border border-slate-200">CÂU ${state.currentQIndex + 1}/${state.questions.length}</div>
                        <div class="flex items-center gap-4 md:gap-8 flex-wrap">
                            <div class="text-lg font-bold text-slate-500">ĐIỂM: <span class="text-3xl text-green-600 font-black">${state.score}</span></div>
                            <div class="bg-slate-100 px-5 py-2 rounded-xl flex items-center gap-3 border border-slate-200 min-w-[120px] justify-center">
                                ⏱ <span id="ui-timer" class="text-3xl font-mono font-bold text-slate-700">${state.timeLeft}</span>s
                            </div>
                            <button onclick="App.confirmEndQuiz()" class="px-4 py-2 bg-red-50 hover:bg-red-100 text-red-600 font-bold rounded-lg transition-colors border border-red-200">Nộp Sớm</button>
                        </div>
                    </div>

                    <div class="bg-white p-6 md:p-10 rounded-3xl shadow-lg border border-slate-200 flex-1 flex flex-col">
                        <div class="text-2xl md:text-3xl font-semibold mb-8 text-slate-800 leading-relaxed border-l-8 border-green-500 pl-6">
                            ${q.q}
                        </div>

                        ${this.htmlQuestionBody(q)}

                        ${!state.isAnswering ? `
                            <div class="mt-10 p-6 rounded-2xl border-2 animate-popIn ${state.lastResult ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}">
                                <h4 class="font-black text-xl mb-3 flex items-center gap-2 uppercase ${state.lastResult ? 'text-green-600' : 'text-red-600'}">
                                    ${state.lastResult ? '✅ CHÍNH XÁC!' : (state.timeLeft <= 0 ? '⏰ HẾT GIỜ / CHƯA CHÍNH XÁC' : '❌ CHƯA CHÍNH XÁC')}
                                </h4>
                                <div class="text-lg text-slate-700 leading-relaxed font-medium break-words">
                                    <span class="font-bold uppercase text-slate-400 text-sm block mb-1">GIẢI THÍCH CHI TIẾT SGK:</span>
                                    ${q.exp}
                                </div>
                            </div>
                        ` : ''}
                        
                        <div class="mt-auto pt-10 flex justify-end">
                            ${state.isAnswering 
                                ? `<button onclick="App.checkAnswer()" class="px-10 md:px-12 py-4 md:py-5 bg-green-600 hover:bg-green-700 text-white font-black rounded-2xl text-xl shadow-[0_5px_15px_rgba(22,163,74,0.3)] transition-transform hover:scale-105">CHỐT ĐÁP ÁN</button>`
                                : `<button onclick="App.nextQ()" class="px-10 md:px-12 py-4 md:py-5 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-2xl text-xl shadow-[0_5px_15px_rgba(79,70,229,0.3)] transition-transform hover:scale-105">${isLast ? 'XEM KẾT QUẢ' : 'CÂU TIẾP THEO ➔'}</button>`
                            }
                        </div>
                    </div>
                </div>
                `;
            },

            htmlQuestionBody(q) {
                if (q.type === 'MC') {
                    return `
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            ${q.opts.map((opt, i) => {
                                const isSel = state.selectedMcOpt === i;
                                const isCorrect = !state.isAnswering && i === q.ans;
                                const isWrongSel = !state.isAnswering && isSel && i !== q.ans;
                                const safeOpt = opt.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
                                return `
                                <div onclick="${state.isAnswering ? `App.clickMC(${i})` : ''}" 
                                     class="p-5 border-2 rounded-2xl text-lg font-medium cursor-pointer transition-all flex items-center shadow-sm
                                     ${isSel ? 'border-green-500 bg-green-50 ring-4 ring-green-100 scale-[1.02]' : 'border-slate-200 hover:border-green-300 hover:bg-slate-50'}
                                     ${isCorrect ? '!border-green-500 !bg-green-100' : ''}
                                     ${isWrongSel ? '!border-red-500 !bg-red-50' : ''}
                                     ">
                                    <span class="w-10 h-10 flex items-center justify-center bg-white border-2 border-slate-300 rounded-full mr-5 font-black text-slate-500 shrink-0">${String.fromCharCode(65+i)}</span>
                                    <div class="flex-1 break-words">${safeOpt}</div>
                                </div>
                                `
                            }).join('')}
                        </div>
                    `;
                }
                
                if (q.type === 'FIB') {
                    return `
                        <div class="flex flex-col md:flex-row items-start md:items-center gap-4 md:gap-6 p-8 bg-slate-50 rounded-2xl border-2 border-slate-200">
                            <span class="font-black text-xl text-slate-500">ĐIỀN ĐÁP ÁN:</span>
                            <input type="text" value="${state.fibAnswer}" ${!state.isAnswering ? 'disabled' : ''} oninput="App.inputFIB(this.value)" class="p-4 border-b-4 border-green-500 bg-white font-black text-green-700 text-2xl text-center w-full md:w-64 focus:outline-none focus:bg-green-50 transition-colors shadow-inner rounded-t-lg">
                        </div>
                    `;
                }

                if (q.type === 'MATCH') {
                    if (!q.rdL) {
                        q.rdL = q.pairs.map((p, i) => ({t: p.l, id: i}));
                        q.rdR = shuffle(q.pairs.map((p, i) => ({t: p.r, id: i})));
                    }
                    return `
                        <div class="flex flex-col md:flex-row gap-6 w-full items-stretch">
                            <div class="flex-1 flex flex-col gap-4">
                                ${q.rdL.map(item => {
                                    const safeText = item.t.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
                                    return `
                                    <div onclick="${state.isAnswering ? `App.clickML(${item.id})` : ''}"
                                         class="p-4 border-2 rounded-2xl cursor-pointer transition-all font-semibold text-base flex items-center shadow-sm h-full min-h-[80px]
                                         ${state.matchLeftSelected === item.id ? 'border-green-500 bg-green-50 ring-4 ring-green-100 scale-[1.02]' : 'border-slate-300 bg-white hover:bg-slate-50'}
                                         ${!state.isAnswering && state.matchPairs[item.id] === item.id ? '!border-green-500 !bg-green-50' : ''}
                                         ${!state.isAnswering && state.matchPairs[item.id] !== undefined && state.matchPairs[item.id] !== item.id ? '!border-red-500 !bg-red-50' : ''}
                                         ">
                                        <div class="w-8 h-8 rounded-full bg-green-100 text-green-700 font-black flex items-center justify-center mr-3 shrink-0">${item.id+1}</div>
                                        <div class="flex-1 break-words">${safeText}</div>
                                    </div>
                                    `
                                }).join('')}
                            </div>
                            
                            <div class="hidden md:flex flex-col justify-around w-12 items-center">
                                ${q.rdL.map(item => {
                                    const pId = state.matchPairs[item.id];
                                    const txt = pId !== undefined ? String.fromCharCode(65 + q.rdR.findIndex(r => r.id === pId)) : '';
                                    return `<div class="w-10 h-10 flex items-center justify-center font-black text-lg rounded-full ${txt ? 'bg-green-600 text-white shadow-md' : 'bg-slate-100 text-slate-300'} transition-colors">${txt || '?'}</div>`;
                                }).join('')}
                            </div>
                            
                            <div class="flex-1 flex flex-col gap-4">
                                ${q.rdR.map((item, idx) => {
                                    const isSel = Object.values(state.matchPairs).includes(item.id);
                                    const safeText = item.t.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
                                    return `
                                    <div onclick="${state.isAnswering ? `App.clickMR(${item.id})` : ''}"
                                         class="p-4 border-2 rounded-2xl cursor-pointer transition-all font-semibold text-base flex items-center shadow-sm h-full min-h-[80px]
                                         ${isSel ? 'border-indigo-300 bg-indigo-50 opacity-60' : 'border-slate-300 bg-white hover:bg-slate-50'}
                                         ">
                                        <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 font-black flex items-center justify-center mr-3 shrink-0">${String.fromCharCode(65+idx)}</div>
                                        <div class="flex-1 break-words">${safeText}</div>
                                    </div>
                                    `
                                }).join('')}
                            </div>
                        </div>
                    `;
                }

                if (q.type === 'DD') {
                    if(!q.rdOpts) q.rdOpts = shuffle([...q.opts]);
                    let fText = q.text;
                    
                    Object.keys(q.correct).forEach(k => {
                        const ans = state.ddAnswers[k];
                        const content = ans ? ans.text : '...';
                        const cls = ans ? 'filled' : '';
                        fText = fText.replace(`[${k}]`, `<span class="ctm-target ${cls}" data-tid="${k}" onclick="${state.isAnswering ? `App.clickDDTgt('${k}')` : ''}">${content}</span>`);
                    });

                    return `
                        <div class="p-6 md:p-8 bg-slate-50 border-2 border-slate-200 rounded-3xl text-xl leading-[2.2] mb-8 shadow-inner font-medium text-slate-700 break-words">
                            ${fText}
                        </div>
                        <div class="flex flex-wrap gap-4 p-6 md:p-8 bg-white border-2 border-dashed border-slate-300 rounded-3xl justify-center min-h-[120px] items-center">
                            ${q.rdOpts.map((opt, i) => {
                                const isUsed = Object.values(state.ddAnswers).some(a => a.idx === i);
                                const isActive = state.ddActiveSource !== null && state.ddActiveSource.idx === i;
                                const safeOpt = opt.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
                                return `<div class="ctm-source text-lg md:text-xl ${isUsed ? 'used' : ''} ${isActive ? 'active' : ''}" data-idx="${i}" onclick="${state.isAnswering ? `App.clickDDSrc(this)` : ''}" data-rawtext="${safeOpt}">${opt}</div>`
                            }).join('')}
                        </div>
                        <div class="text-center mt-4 text-slate-400 font-semibold italic text-sm">👆 Chạm vào từ cho sáng lên, sau đó chạm vào ô trống để điền.</div>
                    `;
                }
            },

            clickMC(i) { state.selectedMcOpt = i; this.render(); },
            inputFIB(v) { state.fibAnswer = v; },
            
            clickML(id) { state.matchLeftSelected = id; this.render(); },
            clickMR(rId) {
                if (state.matchLeftSelected === null) return alertMsg("Hướng dẫn", "Chọn 1 mục ở cột Trái trước (số 1, 2, 3...).");
                for (let k in state.matchPairs) { if (state.matchPairs[k] === rId) delete state.matchPairs[k]; }
                state.matchPairs[state.matchLeftSelected] = rId;
                state.matchLeftSelected = null;
                this.render();
            },

            clickDDSrc(el) {
                if(el.classList.contains('used')) return;
                state.ddActiveSource = { idx: parseInt(el.dataset.idx), text: el.dataset.rawtext };
                this.render();
            },
            clickDDTgt(tId) {
                if (!state.ddActiveSource) {
                    if (state.ddAnswers[tId]) { delete state.ddAnswers[tId]; this.render(); }
                    return;
                }
                state.ddAnswers[tId] = state.ddActiveSource;
                state.ddActiveSource = null;
                this.render();
            },

            checkAnswer(isTimeout = false) {
                if (!state.isAnswering) return;
                clearInterval(state.timerId);
                state.isAnswering = false;
                
                const timeTaken = Math.min(30, 30 - state.timeLeft);
                state.timeSpentTotal += timeTaken;
                
                const q = state.questions[state.currentQIndex];
                let isCorrect = false;
                
                if (q.type === 'MC') isCorrect = state.selectedMcOpt === q.ans;
                if (q.type === 'FIB') isCorrect = state.fibAnswer.toString().trim().toLowerCase().replace(',','.') === q.ans.toLowerCase();
                if (q.type === 'MATCH') isCorrect = Object.keys(q.pairs).length > 0 && Object.keys(q.pairs).every((_, i) => state.matchPairs[i] === i);
                if (q.type === 'DD') isCorrect = Object.keys(q.correct).length > 0 && Object.keys(q.correct).every(k => state.ddAnswers[k] && state.ddAnswers[k].text === q.correct[k]);

                if (isTimeout) isCorrect = false;
                
                state.lastResult = isCorrect;
                if (isCorrect) { state.score++; playSound('correct'); }
                else { playSound('wrong'); }
                
                this.render();
            },

            nextQ() {
                if (state.currentQIndex < state.questions.length - 1) {
                    state.currentQIndex++;
                    this.setupQuestion();
                    this.render();
                } else this.finish();
            },

            confirmEndQuiz() {
                confirmMsg("Nộp bài sớm", "Chắc chắn muốn nộp bài ngay?", () => {
                    clearInterval(state.timerId);
                    this.finish();
                });
            },

            finish() {
                state.history.push({
                    type: state.userType,
                    name: state.userName,
                    score: state.score,
                    time: Math.round(state.timeSpentTotal),
                    date: new Date().toLocaleString('vi-VN')
                });
                localStorage.setItem('physics_history_ch1_b2', JSON.stringify(state.history));
                
                state.screen = 'RESULT';
                if (state.score >= 20) triggerConfetti();
                this.render();
            },

            htmlResult() {
                let msg = state.score >= 20 ? "🎉 XUẤT SẮC! ĐÃ NẮM VỮNG QUY TẮC AN TOÀN!" : (state.score > 10 ? "👏 KHÁ TỐT! XEM LẠI MỘT VÀI CHỖ NHÉ!" : "⚠️ CẦN ĐỌC KĨ LẠI SÁCH GIÁO KHOA!");
                let color = state.score >= 20 ? 'text-green-500' : (state.score > 10 ? 'text-yellow-500' : 'text-red-500');
                
                return `
                <div class="flex-1 flex items-center justify-center p-4 z-10">
                    <div class="bg-white p-8 md:p-12 rounded-3xl shadow-2xl text-center max-w-2xl w-full border-t-8 border-t-green-600 animate-popIn">
                        <h2 class="text-3xl md:text-4xl font-black text-slate-800 mb-2 uppercase">Hoàn Thành Bài Tập</h2>
                        <div class="text-xl text-slate-500 font-bold mb-10 pb-6 border-b-2 border-slate-100 break-words">${state.userName}</div>
                        
                        <div class="flex flex-col md:flex-row justify-center gap-8 md:gap-16 mb-10">
                            <div>
                                <div class="text-sm font-black text-slate-400 uppercase tracking-widest mb-3">ĐIỂM SỐ</div>
                                <div class="text-7xl font-black ${color}">${state.score}<span class="text-4xl text-slate-300">/25</span></div>
                            </div>
                            <div class="hidden md:block w-px bg-slate-200"></div>
                            <div>
                                <div class="text-sm font-black text-slate-400 uppercase tracking-widest mb-3">THỜI GIAN</div>
                                <div class="text-7xl font-black text-slate-700">${Math.round(state.timeSpentTotal)}<span class="text-4xl text-slate-300">s</span></div>
                            </div>
                        </div>

                        <div class="p-6 bg-slate-50 rounded-2xl border border-slate-200 mb-10 shadow-inner">
                            <div class="text-xl md:text-2xl font-bold text-slate-700">${msg}</div>
                        </div>

                        <button onclick="location.reload()" class="px-10 py-5 w-full md:w-auto bg-slate-800 hover:bg-slate-900 font-black rounded-2xl text-white text-xl transition-all shadow-lg hover:scale-105">VỀ TRANG CHỦ LÀM LẠI</button>
                    </div>
                </div>
                `;
            },

            loginAdmin(role) {
                const p = document.getElementById(role === 'TEACHER' ? 'p-teach' : 'p-par').value;
                if ((role === 'TEACHER' && p === '123') || (role === 'PARENT' && p === '123456')) {
                    hideModal(role === 'TEACHER' ? 'mod-teacher' : 'mod-parent');
                    state.screen = 'ADMIN';
                    state.adminRole = role;
                    state.adminTab = role === 'TEACHER' ? 'GROUP' : 'INDIV';
                    this.render();
                } else {
                    alertMsg("Lỗi bảo mật", "Sai mật khẩu truy cập!");
                }
            },

            switchAdminTab(tab) {
                state.adminTab = tab;
                this.render();
            },

            htmlAdmin() {
                const h = state.history;
                const gs = h.filter(x => x.type === 'GROUP').sort((a,b) => b.score - a.score || a.time - b.time);
                const is = h.filter(x => x.type === 'INDIVIDUAL').sort((a,b) => b.score - a.score || a.time - b.time);

                return `
                <div class="min-h-screen bg-slate-50 p-4 md:p-10 w-full z-10 relative">
                    <div class="max-w-6xl mx-auto">
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                            <h2 class="text-2xl md:text-3xl font-black text-slate-800 uppercase flex items-center gap-3">
                                ${state.adminRole === 'TEACHER' ? '👨‍🏫 Quản Lý - Giáo Viên' : '👨‍👩‍👧 Kết Quả - Phụ Huynh'}
                            </h2>
                            <button onclick="location.reload()" class="px-6 py-3 bg-red-100 hover:bg-red-200 text-red-700 font-bold rounded-xl transition-colors border border-red-200 shadow-sm">Thoát</button>
                        </div>
                        
                        <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200">
                            <div class="flex flex-wrap bg-slate-100 border-b-2 border-slate-200">
                                ${state.adminRole === 'TEACHER' ? `<button onclick="App.switchAdminTab('GROUP')" class="flex-1 py-4 md:py-5 font-black text-sm md:text-lg transition-colors ${state.adminTab==='GROUP'?'text-green-700 bg-white border-b-4 border-b-green-600':'text-slate-500 hover:bg-slate-200'}">THỐNG KÊ NHÓM</button>` : ''}
                                <button onclick="App.switchAdminTab('INDIV')" class="flex-1 py-4 md:py-5 font-black text-sm md:text-lg transition-colors ${state.adminTab==='INDIV'?'text-green-700 bg-white border-b-4 border-b-green-600':'text-slate-500 hover:bg-slate-200'}">THỐNG KÊ CÁ NHÂN</button>
                                ${state.adminRole === 'TEACHER' ? `<button onclick="App.switchAdminTab('DE')" class="flex-1 py-4 md:py-5 font-black text-sm md:text-lg transition-colors ${state.adminTab==='DE'?'text-green-700 bg-white border-b-4 border-b-green-600':'text-slate-500 hover:bg-slate-200'}">XEM ĐỀ & ĐÁP ÁN</button>` : ''}
                            </div>
                            
                            <div class="p-4 md:p-8 overflow-x-auto">
                                ${(state.adminTab === 'GROUP' || state.adminTab === 'INDIV') ? `
                                    <table class="w-full text-left border-collapse min-w-[600px]">
                                        <thead><tr class="bg-slate-50 text-slate-500 uppercase text-xs md:text-sm tracking-wider"><th class="p-4 md:p-5 font-black rounded-tl-xl w-16 md:w-24">Hạng</th><th class="p-4 md:p-5 font-black">Tên / Thành viên</th><th class="p-4 md:p-5 font-black text-center">Điểm</th><th class="p-4 md:p-5 font-black text-right">Thời gian</th><th class="p-4 md:p-5 font-black text-right rounded-tr-xl">Nộp lúc</th></tr></thead>
                                        <tbody>
                                            ${(state.adminTab === 'GROUP' ? gs : is).map((x, i) => `
                                                <tr class="border-b border-slate-100 hover:bg-green-50 transition-colors">
                                                    <td class="p-4 md:p-5 font-black text-slate-400 text-lg md:text-xl">#${i+1}</td>
                                                    <td class="p-4 md:p-5 font-bold text-slate-700 text-base md:text-lg max-w-[200px] break-words">${x.name}</td>
                                                    <td class="p-4 md:p-5 font-black text-xl md:text-2xl text-green-600 text-center">${x.score}/25</td>
                                                    <td class="p-4 md:p-5 font-bold text-slate-500 text-right">${x.time}s</td>
                                                    <td class="p-4 md:p-5 text-xs md:text-sm font-semibold text-slate-400 text-right">${x.date}</td>
                                                </tr>
                                            `).join('')}
                                            ${(state.adminTab === 'GROUP' ? gs : is).length === 0 ? `<tr><td colspan="5" class="p-10 text-center text-slate-400 font-bold text-lg">Chưa có dữ liệu.</td></tr>` : ''}
                                        </tbody>
                                    </table>
                                ` : ''}

                                ${state.adminTab === 'DE' ? `
                                    <div class="space-y-6 md:space-y-8">
                                        ${QUESTION_BANK.map((q, i) => `
                                            <div class="p-6 md:p-8 bg-slate-50 rounded-2xl border border-slate-200 shadow-sm">
                                                <div class="font-bold text-lg md:text-xl mb-4 text-slate-800 break-words">Câu ${i+1}: ${q.q}</div>
                                                ${q.type === 'MC' ? `<div class="mb-4 text-slate-500 font-medium">Phương án: ${q.opts.join(' | ')}</div><div class="font-black text-green-600 text-lg">Đúng: ${q.opts[q.ans]}</div>` : ''}
                                                ${q.type === 'FIB' ? `<div class="font-black text-green-600 text-lg">Điền: ${q.ans}</div>` : ''}
                                                ${q.type === 'MATCH' ? `<div class="font-black text-green-600 text-lg mb-2">Ghép:</div><ul class="list-disc ml-6 text-slate-700 font-medium space-y-2">${q.pairs.map(p => `<li><span class="font-bold">${p.l}</span> ➔ ${p.r}</li>`).join('')}</ul>` : ''}
                                                ${q.type === 'DD' ? `<div class="mb-4 text-slate-500 font-medium">Gốc: ${q.text}</div><div class="font-black text-green-600 text-lg mb-2">Từ điền:</div><ul class="list-disc ml-6 text-slate-700 font-medium space-y-1">${Object.keys(q.correct).map(k=>`<li>[${k}]: ${q.correct[k]}</li>`).join('')}</ul>` : ''}
                                                <div class="mt-5 p-4 md:p-5 bg-green-50 text-green-900 rounded-xl border border-green-200 font-medium leading-relaxed break-words"><strong class="uppercase text-green-800">Giải thích:</strong> ${q.exp}</div>
                                            </div>
                                        `).join('')}
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                </div>
                `;
            },

            htmlModals() {
                return `
                <div id="mod-teacher" class="modal-overlay">
                    <div class="modal-content bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full border border-slate-100">
                        <h3 class="text-2xl font-black mb-6 text-slate-800 text-center uppercase">Giáo Viên</h3>
                        <input type="password" id="p-teach" class="w-full p-4 border-2 border-slate-200 rounded-xl mb-8 bg-slate-50 focus:border-green-500 outline-none font-bold text-lg text-center tracking-widest">
                        <div class="flex gap-4">
                            <button onclick="hideModal('mod-teacher')" class="flex-1 py-4 bg-slate-100 hover:bg-slate-200 font-bold rounded-xl text-slate-600 transition-colors">Hủy</button>
                            <button onclick="App.loginAdmin('TEACHER')" class="flex-1 py-4 bg-green-600 hover:bg-green-700 font-bold rounded-xl text-white transition-colors shadow-md">Đăng nhập</button>
                        </div>
                    </div>
                </div>

                <div id="mod-parent" class="modal-overlay">
                    <div class="modal-content bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full border border-slate-100">
                        <h3 class="text-2xl font-black mb-6 text-slate-800 text-center uppercase">Phụ Huynh</h3>
                        <input type="password" id="p-par" class="w-full p-4 border-2 border-slate-200 rounded-xl mb-8 bg-slate-50 focus:border-green-500 outline-none font-bold text-lg text-center tracking-widest">
                        <div class="flex gap-4">
                            <button onclick="hideModal('mod-parent')" class="flex-1 py-4 bg-slate-100 hover:bg-slate-200 font-bold rounded-xl text-slate-600 transition-colors">Hủy</button>
                            <button onclick="App.loginAdmin('PARENT')" class="flex-1 py-4 bg-green-600 hover:bg-green-700 font-bold rounded-xl text-white transition-colors shadow-md">Đăng nhập</button>
                        </div>
                    </div>
                </div>

                <div id="msg-modal" class="modal-overlay" style="z-index: 99999;">
                    <div class="modal-content bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full border-t-8 border-t-blue-500 text-center">
                        <h3 id="msg-title" class="text-2xl font-black mb-3 text-slate-800">Thông báo</h3>
                        <p id="msg-body" class="text-slate-600 mb-8 leading-relaxed font-medium text-lg"></p>
                        <button onclick="hideModal('msg-modal')" class="w-full py-4 bg-blue-600 hover:bg-blue-700 font-black rounded-xl text-white transition-colors shadow-md">Đã hiểu</button>
                    </div>
                </div>

                <div id="confirm-modal" class="modal-overlay" style="z-index: 99998;">
                    <div class="modal-content bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full border-t-8 border-t-red-500 text-center">
                        <h3 id="confirm-title" class="text-2xl font-black mb-3 text-slate-800">Xác nhận</h3>
                        <p id="confirm-body" class="text-slate-600 mb-8 leading-relaxed font-medium text-lg"></p>
                        <div class="flex gap-4">
                            <button onclick="hideModal('confirm-modal')" class="flex-1 py-4 bg-slate-100 hover:bg-slate-200 font-bold rounded-xl text-slate-600 transition-colors">Không</button>
                            <button id="confirm-btn" class="flex-1 py-4 bg-red-600 hover:bg-red-700 font-black rounded-xl text-white transition-colors shadow-md">Đồng ý</button>
                        </div>
                    </div>
                </div>
                `;
            }
        };

        window.App = App;
        window.showModal = showModal;
        window.hideModal = hideModal;
        
        window.onload = () => App.render();
    </script>
</body>
</html>
