        .word-chip.used { opacity: 0.35; pointer-events: none; background-color: #f1f5f9; border-color: #e2e8f0; color: #94a3b8; }

            position: sticky; top: 0; z-index: 40;

<!-- Toast thông báo -->
<div id="toast-notify" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none bg-slate-900 text-white px-5 py-3.5 rounded-2xl shadow-2xl font-bold text-sm flex items-center gap-3"></div>

<script>
    const MODAL = {
        show: (title, msgHtml, onConfirm, showCancel = false, customHtml = '') => {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-msg').innerHTML = msgHtml;
            const inputContainer = document.getElementById('modal-inputs');
            if (customHtml) {
                inputContainer.innerHTML = customHtml;
                inputContainer.classList.remove('hidden');
            } else {
                inputContainer.innerHTML = '';
                inputContainer.classList.add('hidden');
            }
            const btnCancel = document.getElementById('modal-btn-cancel');
            if (showCancel) {
                btnCancel.classList.remove('hidden');
                btnCancel.onclick = () => MODAL.hide();
            } else {
                btnCancel.classList.add('hidden');
            }
            const btnConfirm = document.getElementById('modal-btn-confirm');
            btnConfirm.onclick = () => {
                if (onConfirm) onConfirm();
                else MODAL.hide();
            };
            document.getElementById('custom-modal').classList.add('active');
        },
        hide: () => document.getElementById('custom-modal').classList.remove('active')
    };

    const defaultRawQuestions = [

            type: 'MC',

            correct: 0,
            explain: "Theo Bảng 2.1 SGK Trang 13: Kí hiệu \"DC hoặc dấu -\" biểu thị dòng điện một chiều."
        },
        {
            type: 'MC',
            text: "Trên bao bì hoặc thân thiết bị thí nghiệm, kí hiệu hai mũi tên thẳng đứng quay lên ($\\uparrow\\uparrow$) có ý nghĩa gì?",
            options: ["Dụng cụ cần đặt đứng.", "Dụng cụ dễ vỡ khi va chạm.", "Tránh ánh nắng chiếu trực tiếp.", "Cần lưu ý cẩn thận khi sử dụng."],
            correct: 0,
            explain: "Theo Bảng 2.1 SGK Trang 13: Kí hiệu hai mũi tên thẳng đứng quay lên chỉ dẫn \"Dụng cụ đặt đứng\"."
        },
        {
            type: 'MC',
            text: "Biển cảnh báo hình tam giác viền đen nền vàng bên trong có hình tia phát xạ cảnh báo mối nguy hiểm nào?",
            options: ["Cảnh báo tia laser.", "Cảnh báo nhiệt độ cao.", "Cảnh báo nơi có từ trường mạnh.", "Cảnh báo bình khí nén áp suất cao."],
            correct: 0,
            explain: "Theo Bảng 2.1 SGK Trang 13: Biển báo hình tam giác vàng có tia phát xạ nhọn mang ý nghĩa \"Cảnh báo tia laser\"."
        },
        {
            type: 'MC',
            text: "Khi phòng thực hành xảy ra đám cháy nơi có thiết bị điện hoặc hoá chất nhẹ hơn nước (như cồn, dầu), tuyệt đối KHÔNG được sử dụng chất nào sau đây để dập lửa?",
            options: ["Nước.", "Bình bọt chữa cháy chuyên dụng.", "Bình bột chữa cháy khô.", "Cát khô."],
            correct: 0,
            explain: "Theo mục lưu ý SGK Trang 15: \"Không được sử dụng nước dập đám cháy nơi có các thiết bị điện...\" vì nước dẫn điện và làm chất lỏng nhẹ nổi lên cháy lan."
        },
        {
            type: 'MC',
            text: "Hiện tượng dòng điện chạy qua cơ thể người gây ra những tổn thương cho các bộ phận hoặc tử vong được gọi là gì?",
            options: ["Sốc điện (điện giật).", "Hiện tượng đoản mạch.", "Quá tải dòng điện.", "Phóng điện hồ quang."],
            correct: 0,
            explain: "Theo mục Em có biết SGK Trang 16: \"Sốc điện (hay điện giật): Sốc điện xảy ra khi dòng điện chạy qua người...\""
        },
        {
            type: 'TF_CLUSTER',
            text: "Phân tích các quy tắc và biện pháp phòng cháy, chữa cháy trong phòng thực hành Vật lí (Mục 3 - SGK Trang 15):",
            statements: [

            explain: "A, B, D đúng. C sai vì cánh quạt 3 cánh trên nền vàng là chất phóng xạ."
        },
        {
            type: 'TF_CLUSTER',
            text: "Xét các nguyên tắc an toàn khi sử dụng thiết bị nhiệt, thuỷ tinh và dụng cụ quang học (SGK Trang 13 & 14):",

        const img = new Image();
        img.src = base64Str;
        img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            callback(canvas.toDataURL('image/jpeg', 0.75));
        };
        img.onerror = () => callback(base64Str);
    };

                Tone.start();
                const ctx = Tone.getContext();
                const bufferSize = ctx.sampleRate * 2.2;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-((i % 4200) / 650));
                }
                const noiseSource = ctx.createBufferSource();
                noiseSource.buffer = buffer;
                const filter = ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1350;
                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.85, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 2.0);
                noiseSource.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
                noiseSource.start();
            }
        } catch (e) {}

        if (speechText && 'speechSynthesis' in window) {
            try {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(speechText);

                                </tr>
                            </thead>

                    q.statements.forEach((stmt, i) => {
                        const selT = ansData[i] === true ? 'checked' : '';
                        const selF = ansData[i] === false ? 'checked' : '';
                        const disabled = isRes ? 'disabled' : '';
                        html += `
                            <tr class="border-b border-slate-100 last:border-b-0 hover:bg-slate-50 transition">
                                <td class="p-4 text-base font-medium text-slate-700"><span class="font-bold text-slate-400 mr-2">${['A','B','C','D'][i]}.</span> ${stmt.text}</td>
                                <td class="p-4 text-center border-l-2 border-slate-200 bg-emerald-50/30">
                                    <label class="cursor-pointer block w-full h-full">
                                        <input type="radio" name="tf_${q.displayId}_${i}" value="T" ${selT} ${disabled} onchange="App.handleTFSelect(${q.displayId}, ${i}, true)" class="w-5 h-5 accent-emerald-600 cursor-pointer">
                                    </label>
                                </td>
                                <td class="p-4 text-center border-l-2 border-slate-200 bg-rose-50/30">
                                    <label class="cursor-pointer block w-full h-full">
                                        <input type="radio" name="tf_${q.displayId}_${i}" value="F" ${selF} ${disabled} onchange="App.handleTFSelect(${q.displayId}, ${i}, false)" class="w-5 h-5 accent-rose-600 cursor-pointer">
                                    </label>
                                </td>
                            </tr>`;
                    });
                    html += `</tbody></table></div>`;
                }
                else if (q.type === 'SHORT_ANS') {
                    const val = AppState.answers[q.displayId] !== undefined ? AppState.answers[q.displayId] : '';
                    const disabled = isRes ? 'disabled' : '';
                    html += `
                    <div class="flex flex-col sm:flex-row items-center gap-4 bg-slate-50 p-6 rounded-2xl border-2 border-slate-200">
                        <span class="font-black text-slate-500 uppercase tracking-wider text-sm">ĐÁP ÁN CỦA BẠN:</span>
                        <input type="text" ${disabled} value="${val}" onchange="App.handleShortAnsChange(${q.displayId}, this.value)" placeholder="Nhập số..." class="w-full sm:w-60 border-2 border-slate-300 p-3.5 rounded-xl font-black text-emerald-700 text-center text-xl shadow-inner focus:border-emerald-600 outline-none transition">
                    </div>`;
                }
                else if (q.type === 'MATCH') {
                    const ms = AppState.matchPairsState[q.displayId] || { selectedLeft: null, selectedRight: null, pairs: [] };
                    html += `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div class="space-y-3">
                            <div class="text-xs font-black text-slate-400 uppercase tracking-widest text-center mb-1">Cột 1</div>
                            ${q.lefts.map((l, lIdx) => {
                                const pair = ms.pairs.find(p => p.left === l.id);
                                const isPaired = !!pair;
                                const isSelected = ms.selectedLeft === l.id;
                                let badge = isPaired
                                    ? `<span class="bg-emerald-500 text-white rounded-full w-7 h-7 flex items-center justify-center mr-3 text-xs font-black">${ms.pairs.indexOf(pair) + 1}</span>`
                                    : `<span class="bg-slate-200 text-slate-500 rounded-full w-7 h-7 flex items-center justify-center mr-3 text-xs font-black">${lIdx + 1}</span>`;
                                return `<div onclick="${isRes ? '' : `App.clickMatchLeft(${q.displayId}, ${l.id})`}" class="match-card ${isPaired ? 'paired' : ''} ${isSelected ? 'selected' : ''}">${badge}<div>${l.text}</div></div>`;
                            }).join('')}
                        </div>
                        <div class="space-y-3">
                            <div class="text-xs font-black text-slate-400 uppercase tracking-widest text-center mb-1">Cột 2</div>
                            ${q.rights.map((r, rIdx) => {
                                const pair = ms.pairs.find(p => p.right === r.id);
                                const isPaired = !!pair;
                                const isSelected = ms.selectedRight === r.id;
                                let badge = isPaired
                                    ? `<span class="bg-emerald-500 text-white rounded-full w-7 h-7 flex items-center justify-center mr-3 text-xs font-black">${ms.pairs.indexOf(pair) + 1}</span>`
                                    : `<span class="bg-slate-200 text-slate-500 rounded-full w-7 h-7 flex items-center justify-center mr-3 text-xs font-black">${String.fromCharCode(65 + rIdx)}</span>`;
                                return `<div onclick="${isRes ? '' : `App.clickMatchRight(${q.displayId}, ${r.id})`}" class="match-card ${isPaired ? 'paired' : ''} ${isSelected ? 'selected' : ''}">${badge}<div>${r.text}</div></div>`;
                            }).join('')}
                        </div>
                    </div>`;
                }
                else if (q.type === 'FILL_BLANK') {
                    const st = AppState.fillBlankState[q.displayId] || { selectedWord: null, blanks: {} };
                    let paragraph = q.text;
                    Object.keys(q.correct).forEach(k => {
                        const filledWord = st.blanks[k];
                        const cls = filledWord ? 'filled' : '';
                        const slotHtml = `<span class="blank-slot ${cls}" onclick="${isRes ? '' : `App.clickBlankSlot(${q.displayId}, '${k}')`}">${filledWord || '?'}</span>`;
                        paragraph = paragraph.replace(`[${k}]`, slotHtml);
                    });
                    html += `<div class="text-lg leading-loose bg-slate-50 p-6 rounded-2xl border-2 border-slate-200 font-medium text-slate-800">${paragraph}</div>`;
                    if (!isRes) {
                        html += `
                        <div class="mt-4 pt-4 border-t border-slate-200">
                            <p class="text-xs font-black text-slate-400 uppercase tracking-wider mb-3">DANH SÁCH TỪ GỢI Ý:</p>
                            <div class="flex flex-wrap gap-2.5">`;
                        q.words.forEach(w => {
                            const isUsed = Object.values(st.blanks).includes(w);
                            const isSel = st.selectedWord === w;
                            const cls = `${isUsed ? 'used' : ''} ${isSel ? 'selected' : ''}`;
                            html += `<div class="word-chip ${cls}" onclick="App.clickWordChip(${q.displayId}, '${w}')">${w}</div>`;

                html += `</div>`;
                if (isRes) {
                    const rs = getScoreForQuestion(q);
                    const isFull = rs.score === rs.max;
                    html += `
                    <div class="mt-6 p-5 rounded-2xl bg-slate-50 border-2 ${isFull ? 'border-emerald-300' : 'border-rose-300'}">
                        <div class="mb-3"><span class="px-3 py-1 rounded-full font-black text-xs ${isFull ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">${isFull ? '✅ CHÍNH XÁC' : '❌ CHƯA ĐÚNG'} (+${rs.score}đ)</span></div>
                        <div class="text-slate-700 text-sm leading-relaxed border-t border-slate-200 pt-3">
                            <strong class="text-slate-900 block mb-1 uppercase text-xs">Giải thích chi tiết (Theo SGK):</strong>
                            ${q.explain}
                        </div>
                    </div>`;
                }
                html += `</div>`;
                return html;

    };

    const renderQuiz = () => `

                                <button onclick="App.switchAdminTab('EXAM')" class="${AppState.adminTab === 'EXAM' ? 'bg-emerald-600 text-white' : 'text-slate-600'} px-4 py-3 rounded-xl text-left w-full font-bold text-sm">📖 Soạn & Sửa đề</button>
                            ` : `
                                <button class="bg-emerald-600 text-white px-4 py-3 rounded-xl text-left w-full font-bold text-sm">👤 Kết quả Cá nhân (${indivs.length})</button>
                            `}
                        </div>
                    </div>
                    <div class="flex-1 bg-white rounded-3xl shadow-sm border p-6 md:p-8 min-h-[500px]">
                        ${AppState.adminTab === 'GROUP' ? `

                            <div class="overflow-x-auto"><table class="w-full text-left border-collapse">
                                <thead><tr class="bg-slate-50 text-slate-400 uppercase text-xs border-b-2"><th class="p-4 w-20 text-center">Hạng</th><th class="p-4 font-black">Tên Nhóm</th><th class="p-4 font-black text-center">Điểm</th><th class="p-4 font-black text-right">Thời gian</th></tr></thead>
                                <tbody>${groups.map((g, i) => `<tr class="border-b hover:bg-slate-50"><td class="p-4 text-center font-black">#${i+1}</td><td class="p-4 font-bold text-slate-800">${g.name}</td><td class="p-4 font-black text-emerald-600 text-center">${g.score.toFixed(2)}</td><td class="p-4 font-mono font-bold text-slate-600 text-right">${Math.floor(g.time/60)}m ${g.time%60}s</td></tr>`).join('')}</tbody>
                            </table></div>
                        ` : (AppState.adminTab === 'INDIV' ? `
                            <h2 class="text-2xl font-black text-slate-800 mb-6">KẾT QUẢ THI CÁ NHÂN</h2>
                            <div class="overflow-x-auto"><table class="w-full text-left border-collapse">
                                <thead><tr class="bg-slate-50 text-slate-400 uppercase text-xs border-b-2"><th class="p-4 w-20 text-center">Hạng</th><th class="p-4 font-black">Học Sinh</th><th class="p-4 font-black text-center">Điểm</th><th class="p-4 font-black text-right">Thời gian</th></tr></thead>
                                <tbody>${indivs.map((g, i) => `<tr class="border-b hover:bg-slate-50"><td class="p-4 text-center font-black">#${i+1}</td><td class="p-4 font-bold text-slate-800">${g.name}</td><td class="p-4 font-black text-emerald-600 text-center">${g.score.toFixed(2)}</td><td class="p-4 font-mono font-bold text-slate-600 text-right">${Math.floor(g.time/60)}m ${g.time%60}s</td></tr>`).join('')}</tbody>
                            </table></div>
                        ` : `
                            <div class="flex flex-wrap items-center justify-between gap-4 mb-6 pb-4 border-b border-slate-200">

                                <div class="flex items-center gap-3">
                                    <button type="button" onclick="App.saveAllExamInline()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-black shadow-md transition text-sm">💾 LƯU TOÀN BỘ ĐỀ</button>
                                    <button onclick="App.confirmResetQuestions()" class="px-4 py-2 bg-rose-50 text-rose-700 font-bold text-xs rounded-xl border border-rose-200">🔄 Khôi phục đề gốc</button>

                            <div class="space-y-6">

                                                <button onclick="App.openEditModal(${idx})" class="px-3.5 py-1.5 bg-indigo-50 text-indigo-700 border border-indigo-200 rounded-xl text-xs font-black">✏️ Chi tiết & Dán ảnh</button>

                            </div>
                        `)}
                    </div>
                </div>
            </div>
        `;
    };

    const getScoreForQuestion = (q) => {
        let s = 0, m = 1;
        const a = AppState.answers[q.displayId];
        if (q.type === 'MC' && a === q.correct) s = 1;
        if (q.type === 'TF_CLUSTER' && a) {
            let correctCount = 0;
            q.statements.forEach((stmt, i) => { if (a[i] === stmt.correct) correctCount++; });
            if (correctCount === 1) s = 0.1;
            else if (correctCount === 2) s = 0.25;
            else if (correctCount === 3) s = 0.5;
            else if (correctCount === 4) s = 1.0;
        }
        if (q.type === 'SHORT_ANS' && a !== undefined && a !== '') {
            const userNum = parseFloat(a.toString().replace(',', '.'));
            if (!isNaN(userNum) && userNum === q.correct) s = 1;
        }
        if (q.type === 'MATCH') {
            const st = AppState.matchPairsState[q.displayId];
            if (st && st.pairs && st.pairs.length === 4 && st.pairs.every(p => p.left === p.right)) s = 1;
        }
        if (q.type === 'FILL_BLANK') {
            const st = AppState.fillBlankState[q.displayId];
            if (st && st.blanks && Object.keys(st.blanks).length === Object.keys(q.correct).length) {
                let ok = true;
                Object.keys(q.correct).forEach(k => { if (st.blanks[k] !== q.correct[k]) ok = false; });
                if (ok) s = 1;
            }
        }
        return { score: s, max: m };
    };

    const submitExam = (isTimeout = false) => {
        if (AppState.timerInt) clearInterval(AppState.timerInt);
        AppState.status = 'RESULT';
        let total = 0;
        AppState.questions.forEach(q => { total += getScoreForQuestion(q).score; });

        const timeUsed = isTimeout ? 600 : (600 - AppState.timeLeft);
        let db = [];
        try { db = JSON.parse(localStorage.getItem('vatli10_b2_scores_v4') || '[]'); } catch (e) { db = []; }

        const cleanName = AppState.user.name.trim();
        const userKey = `${AppState.user.type}_${cleanName.toLowerCase()}`;
        const newRecord = { key: userKey, type: AppState.user.type, name: cleanName, score: total, time: timeUsed, date: new Date().toISOString() };

        const existIdx = db.findIndex(d => d.key === userKey);
        if (existIdx > -1) db[existIdx] = newRecord; else db.push(newRecord);

        localStorage.setItem('vatli10_b2_scores_v4', JSON.stringify(db));
        App.render();
        safeMathJax();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.App = {
        render: () => {
            const container = document.getElementById('app');
            if (AppState.status === 'LOGIN') container.innerHTML = renderLogin();
            else if (AppState.status === 'QUIZ') container.innerHTML = renderQuiz();
            else if (AppState.status === 'RESULT') container.innerHTML = renderResult();
            else if (AppState.status === 'ADMIN') container.innerHTML = renderAdmin();
        },
        switchLoginTab: (tab) => {
            document.getElementById('tab-indiv').className = tab === 'INDIV' ? "flex-1 pb-3 text-center border-b-4 font-black border-emerald-600 text-emerald-600 transition text-base" : "flex-1 pb-3 text-center border-b-4 font-black border-transparent text-slate-400 transition text-base";
            document.getElementById('tab-group').className = tab === 'GROUP' ? "flex-1 pb-3 text-center border-b-4 font-black border-emerald-600 text-emerald-600 transition text-base" : "flex-1 pb-3 text-center border-b-4 font-black border-transparent text-slate-400 transition text-base";
            document.getElementById('form-indiv').style.display = tab === 'INDIV' ? 'block' : 'none';
            document.getElementById('form-group').style.display = tab === 'GROUP' ? 'block' : 'none';
        },
        doLogin: (type) => {
            if (type === 'INDIVIDUAL') {
                const name = document.getElementById('inp-name').value.trim();
                const pass = document.getElementById('inp-pass').value.trim();
                if (!name) return MODAL.show('Thông báo', 'Vui lòng nhập Họ và Tên!');
                if (pass !== '123456') return MODAL.show('Lỗi', 'Mật khẩu thi không chính xác!');
                AppState.user = { type: 'INDIVIDUAL', id: name, name: name };
            } else {
                const grp = document.getElementById('inp-group-num').value;
                const names = document.getElementById('inp-group-names').value.trim();
                if (!names) return MODAL.show('Thông báo', 'Vui lòng nhập tên thành viên nhóm.');
                AppState.user = { type: 'GROUP', id: grp, name: `Nhóm ${grp} (${names})` };
            }
            initQuiz();
        },
        showAdminLogin: (role) => {
            const isTeacher = role === 'TEACHER';
            MODAL.show(
                isTeacher ? 'Đăng Nhập Giáo Viên' : 'Đăng Nhập Phụ Huynh',
                'Nhập mật khẩu xác thực:',
                () => {
                    const passInput = document.getElementById('modal-inp-pass');
                    if (passInput && passInput.value === (isTeacher ? '123' : '123456')) {
                        MODAL.hide();
                        AppState.status = 'ADMIN';
                        AppState.user.type = isTeacher ? 'ADMIN_TEACHER' : 'ADMIN_PARENT';
                        AppState.adminTab = isTeacher ? 'GROUP' : 'INDIV';
                        App.render();
                    } else {
                        if (passInput) passInput.value = '';
                    }
                },
                true,
                `<input type="password" id="modal-inp-pass" class="w-full border-2 border-slate-300 p-3.5 rounded-xl outline-none text-center font-bold tracking-widest text-lg" placeholder="Mật khẩu..." autofocus>`
            );
        },
        switchAdminTab: (tab) => { AppState.adminTab = tab; App.render(); },
        refreshAdmin: () => App.render(),
        goHome: () => { if (AppState.timerInt) clearInterval(AppState.timerInt); AppState.status = 'LOGIN'; App.render(); },
        logoutStudent: (askConfirm) => {
            if (askConfirm) {
                MODAL.show('Đăng Xuất', 'Bạn có chắc chắn muốn đăng xuất?', () => { MODAL.hide(); App.goHome(); }, true);
            } else { App.goHome(); }
        },
        retryQuiz: () => initQuiz(),
        askSubmit: () => {
            MODAL.show('Xác Nhận Nộp Bài', 'Bạn có chắc chắn muốn nộp bài?', () => { MODAL.hide(); submitExam(false); }, true);
        },
        handleMCSelect: (qId, idx) => { AppState.answers[qId] = idx; updateNavBtn(qId); },
        handleTFSelect: (qId, stmtIdx, val) => {
            if (!AppState.answers[qId]) AppState.answers[qId] = {};
            AppState.answers[qId][stmtIdx] = val;
            const q = AppState.questions.find(x => x.displayId === qId);
            if (q && Object.keys(AppState.answers[qId]).length === q.statements.length) updateNavBtn(qId);
        },
        handleShortAnsChange: (qId, val) => {
            if (val.trim()) { AppState.answers[qId] = val; updateNavBtn(qId); }
            else { delete AppState.answers[qId]; removeNavBtn(qId); }
        },
        clickMatchLeft: (qId, lId) => {
            let ms = AppState.matchPairsState[qId];
            if (ms.pairs.some(p => p.left === lId)) return;
            ms.selectedLeft = lId;
            tryMatch(qId);
        },
        clickMatchRight: (qId, rId) => {
            let ms = AppState.matchPairsState[qId];
            if (ms.pairs.some(p => p.right === rId)) return;
            ms.selectedRight = rId;
            tryMatch(qId);
        },
        clickWordChip: (qId, w) => { AppState.fillBlankState[qId].selectedWord = w; },
        clickBlankSlot: (qId, k) => {
            let st = AppState.fillBlankState[qId];
            if (st.blanks[k]) delete st.blanks[k];
            else if (st.selectedWord) { st.blanks[k] = st.selectedWord; st.selectedWord = null; }
            const q = AppState.questions.find(x => x.displayId === qId);
            if (q && Object.keys(st.blanks).length === Object.keys(q.correct).length) { AppState.answers[qId] = true; updateNavBtn(qId); }
            else { delete AppState.answers[qId]; removeNavBtn(qId); }
            App.render(); safeMathJax();
        },
        openEditModal: (idx) => {
            const qs = getStoredQuestions();
            const q = qs[idx];
            if (!q) return;
            AppState.currentEditingIndex = idx;
            AppState.currentEditingImage = q.image || null;
            document.getElementById('edit-modal-q-badge').innerText = `Câu ${idx + 1} (${q.type})`;
            document.getElementById('edit-q-text').value = q.text || '';
            document.getElementById('edit-q-explain').value = q.explain || '';
            const previewContainer = document.getElementById('edit-img-preview-container');
            const previewImg = document.getElementById('edit-img-preview');
            if (q.image) {
                previewImg.src = q.image;
                previewContainer.classList.remove('hidden');
                previewContainer.classList.add('flex');
            } else {
                previewImg.src = '';
                previewContainer.classList.add('hidden');
                previewContainer.classList.remove('flex');
            }
            const dyn = document.getElementById('edit-q-dynamic-fields');
            let dynHtml = '';
            if (q.type === 'MC') {
                dynHtml += `<label class="block text-xs font-black text-slate-500 uppercase mb-2">Các phương án:</label>`;
                q.options.forEach((opt, oi) => {
                    dynHtml += `<div class="flex items-center gap-3"><input type="radio" name="edit_mc" value="${oi}" ${q.correct===oi?'checked':''} class="accent-indigo-600"><input type="text" id="edit_opt_${oi}" value="${opt}" class="flex-1 border rounded-xl p-2 text-sm"></div>`;
                });
            } else if (q.type === 'SHORT_ANS') {
                dynHtml += `<label class="block text-xs font-black text-slate-500 uppercase mb-2">Đáp án số:</label><input type="text" id="edit_short" value="${q.correct}" class="w-40 border rounded-xl p-2 font-bold text-center">`;
            }
            dyn.innerHTML = dynHtml;
            document.getElementById('edit-question-modal').classList.add('active');
        },
        closeEditModal: () => document.getElementById('edit-question-modal').classList.remove('active'),
        removeEditImage: () => {
            AppState.currentEditingImage = null;
            document.getElementById('edit-img-preview-container').classList.add('hidden');
        },
        handleImageUpload: (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                compressImage(event.target.result, 800, (url) => {
                    AppState.currentEditingImage = url;
                    document.getElementById('edit-img-preview').src = url;
                    document.getElementById('edit-img-preview-container').classList.remove('hidden');
                    document.getElementById('edit-img-preview-container').classList.add('flex');
                });
            };
            reader.readAsDataURL(file);
        },
        saveQuestionEdit: () => {
            const idx = AppState.currentEditingIndex;
            if (idx === null) return;
            const qs = getStoredQuestions();
            const q = qs[idx];
            q.text = document.getElementById('edit-q-text').value.trim();
            q.explain = document.getElementById('edit-q-explain').value.trim();
            q.image = AppState.currentEditingImage || null;
            if (q.type === 'MC') {
                q.options = [0, 1, 2, 3].map(i => document.getElementById(`edit_opt_${i}`).value.trim());
                const sel = document.querySelector('input[name="edit_mc"]:checked');
                if (sel) q.correct = parseInt(sel.value, 10);
            } else if (q.type === 'SHORT_ANS') {
                const val = parseFloat(document.getElementById('edit_short').value.trim().replace(',', '.'));
                if (!isNaN(val)) q.correct = val;
            }
            qs[idx] = q;
            saveStoredQuestions(qs);
            App.closeEditModal();
            App.render();
            showToastMessage(`✅ Đã lưu Câu ${idx + 1}!`);
        },
        saveSingleExamInline: (idx) => {
            const qs = getStoredQuestions();
            const q = qs[idx];
            if (!q) return;
            const textEl = document.getElementById(`inline-q-text-${idx}`);
            const expEl = document.getElementById(`inline-q-explain-${idx}`);
            if (textEl) q.text = textEl.value.trim();
            if (expEl) q.explain = expEl.value.trim();
            qs[idx] = q;
            saveStoredQuestions(qs);
            showToastMessage(`✅ Đã lưu Câu ${idx + 1}!`);
        },
        saveAllExamInline: () => {
            const qs = getStoredQuestions();
            qs.forEach((q, idx) => {
                const textEl = document.getElementById(`inline-q-text-${idx}`);
                const expEl = document.getElementById(`inline-q-explain-${idx}`);
                if (textEl) q.text = textEl.value.trim();
                if (expEl) q.explain = expEl.value.trim();
            });
            saveStoredQuestions(qs);
            showToastMessage(`🎉 Đã lưu toàn bộ đề thi thành công!`);
        },
        removeInlineImage: (idx) => {
            const qs = getStoredQuestions();
            if (qs[idx]) {
                qs[idx].image = null;
                saveStoredQuestions(qs);
                App.render();
                showToastMessage(`🗑️ Đã gỡ ảnh câu ${idx + 1}!`);
            }
        },
        confirmResetQuestions: () => {
            MODAL.show('Khôi Phục', 'Khôi phục 25 câu gốc SGK?', () => {
                localStorage.removeItem('vatli10_b2_questions_v4');
                MODAL.hide();
                App.render();
            }, true);
        }
    };

    function showToastMessage(msg) {
        const toast = document.getElementById('toast-notify');
        if (!toast) return;
        toast.innerText = msg;
        toast.classList.remove('translate-y-20', 'opacity-0');
        setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 2500);
    }

    function tryMatch(qId) {
        let ms = AppState.matchPairsState[qId];
        if (ms.selectedLeft !== null && ms.selectedRight !== null) {
            ms.pairs.push({ left: ms.selectedLeft, right: ms.selectedRight });
            ms.selectedLeft = null; ms.selectedRight = null;
            if (ms.pairs.length === 4) { AppState.answers[qId] = true; updateNavBtn(qId); }
            App.render(); safeMathJax();
        }
    }

    function updateNavBtn(qId) {
        const btn = document.getElementById(`nav-btn-${qId}`);
        if (btn) { btn.classList.remove('unanswered'); btn.classList.add('answered'); }
    }
    function removeNavBtn(qId) {
        const btn = document.getElementById(`nav-btn-${qId}`);
        if (btn) { btn.classList.remove('answered'); btn.classList.add('unanswered'); }
    }

    window.addEventListener('paste', (e) => {
        const modal = document.getElementById('edit-question-modal');
        if (!modal || !modal.classList.contains('active')) return;
        const items = (e.clipboardData || e.originalEvent.clipboardData).items;
        for (let i = 0; i < items.length; i++) {
            if (items[i].type.indexOf('image') !== -1) {
                const blob = items[i].getAsFile();
                const reader = new FileReader();
                reader.onload = (event) => {
                    compressImage(event.target.result, 800, (url) => {
                        AppState.currentEditingImage = url;
                        document.getElementById('edit-img-preview').src = url;
                        document.getElementById('edit-img-preview-container').classList.remove('hidden');
                        document.getElementById('edit-img-preview-container').classList.add('flex');
                    });
                };
                reader.readAsDataURL(blob);
                break;
            }
        }
    });

    window.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
            const modal = document.getElementById('edit-question-modal');
            if (modal && modal.classList.contains('active')) {
                e.preventDefault();
                App.saveQuestionEdit();
            }
        }
    });

    App.render();
</script>
</body>
</html>
