<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập Tương Tác KHTN 9: Bài 2:  Động năng - Thế năng</title>
    <!-- Thư viện Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Thư viện Âm thanh Tone.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Thư viện Pháo giấy Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; color: #1f2937; scroll-behavior: smooth; }
        
        /* TỐI ƯU MATHJAX: CHỐNG NHẢY DÒNG VÀ HIỂN THỊ CÙNG DÒNG VĂN BẢN */
        mjx-container { display: inline-block !important; pointer-events: none; }
        mjx-container svg { display: inline-block !important; }
        .katex-display { margin: 0 !important; }
        
        /* KÉO THẢ & CLICK-TO-MATCH CSS */
        .blank-slot { 
            display: inline-flex; align-items: center; justify-content: center; min-width: 80px; min-height: 28px; 
            border-bottom: 2px dashed #3b82f6; text-align: center; 
            padding: 2px 8px; margin: 0 4px; cursor: pointer; color: #1d4ed8; font-weight: 600;
            background-color: #eff6ff; border-radius: 4px; transition: all 0.2s; vertical-align: bottom;
        }
        .blank-slot:hover { background-color: #dbeafe; }
        .word-chip {
            display: inline-block; padding: 6px 12px; margin: 4px; 
            background-color: #ffffff; border: 1px solid #d1d5db; border-radius: 999px;
            cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.05); user-select: none;
            transition: all 0.2s; font-weight: 500;
        }
        .word-chip.selected { background-color: #3b82f6; color: white; border-color: #2563eb; transform: scale(1.05); shadow: md; }
        .word-chip.used { opacity: 0.4; pointer-events: none; background-color: #e5e7eb; color: #6b7280; }

        /* SCROLLBAR & STICKY NAV */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        
        .sticky-nav {
            position: sticky; top: 0; z-index: 40; background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px); border-bottom: 1px solid #e5e7eb;
        }
        .nav-btn {
            width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: 700; cursor: pointer; transition: all 0.2s; border: 2px solid transparent; flex-shrink: 0;
        }
        .nav-btn.unanswered { background-color: #d1fae5; color: #065f46; border-color: #34d399; }
        .nav-btn.answered { background-color: #fef08a; color: #854d0e; border-color: #facc15; }
        .nav-btn.active { box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.3); border-color: #2563eb; transform: translateY(-2px); }

        /* MATCHING PAIRS CSS */
        .match-item {
            padding: 12px; border: 2px solid #e5e7eb; border-radius: 8px; cursor: pointer;
            transition: all 0.2s; background: white; user-select: none; text-align: center; font-weight: 500;
        }
        .match-item.selected { border-color: #3b82f6; background-color: #eff6ff; box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
        .match-item.paired { border-color: #10b981; background-color: #d1fae5; color: #065f46; pointer-events: none; }
        
        /* MODAL */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none;
            transition: opacity 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content { transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); max-width: 90vw; max-height: 90vh; overflow-y: auto;}
        .modal-overlay.active .modal-content { transform: scale(1); }
    </style>
    <!-- Cấu hình MathJax an toàn -->
    <script>
        window.MathJax = {
            startup: { typeset: false },
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>

<!-- Giao diện chính của App -->
<div id="app" class="min-h-screen"></div>

<div id="custom-modal" class="modal-overlay">
    <div class="modal-content bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md border-t-8 border-blue-500 text-center">
        <h3 id="modal-title" class="text-2xl font-black text-gray-800 mb-3"></h3>
        <p id="modal-msg" class="text-gray-600 mb-8 text-lg font-medium leading-relaxed"></p>
        <div id="modal-inputs" class="mb-6 hidden"></div>
        <div class="flex gap-4 justify-center">
            <button id="modal-btn-cancel" class="flex-1 px-4 py-3 bg-gray-100 text-gray-700 rounded-xl font-bold hover:bg-gray-200 transition hidden">Hủy Bỏ</button>
            <button id="modal-btn-confirm" class="flex-1 px-4 py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition shadow-lg">Xác Nhận</button>
        </div>
    </div>
</div>

<script type="module">
    // CẦN CÓ ĐỐI TƯỢNG MODAL
    const MODAL = {
        show: (title, msg, onConfirm, showCancel = false, customHtml = '') => {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-msg').innerHTML = msg;
            
            const inputs = document.getElementById('modal-inputs');
            if (customHtml) {
                inputs.innerHTML = customHtml;
                inputs.classList.remove('hidden');
            } else {
                inputs.innerHTML = '';
                inputs.classList.add('hidden');
            }

            const btnCancel = document.getElementById('modal-btn-cancel');
            if (showCancel) {
                btnCancel.classList.remove('hidden');
                btnCancel.onclick = () => MODAL.hide();
            } else {
                btnCancel.classList.add('hidden');
            }

            const btnConfirm = document.getElementById('modal-btn-confirm');
            btnConfirm.onclick = () => {
                if (onConfirm) onConfirm();
            };

            document.getElementById('custom-modal').classList.add('active');
        },
        hide: () => {
            document.getElementById('custom-modal').classList.remove('active');
        }
    };

    const rawQuestions = [
        // DẠNG 1: TRẮC NGHIỆM 4 LỰA CHỌN (MC) - 5 Câu
        {
            type: 'MC', text: "Động năng của một vật phụ thuộc vào những yếu tố nào?",
            options: ["Khối lượng và tốc độ của vật.", "Trọng lượng và độ cao của vật.", "Thể tích và nhiệt độ của vật.", "Khối lượng và vị trí của vật."],
            correct: 0, explain: "Theo SGK KHTN 9 (Trang 15), Động năng của vật phụ thuộc vào khối lượng và tốc độ của nó. Công thức $W_d = \\frac{1}{2}mv^2$."
        },
        {
            type: 'MC', text: "Thế năng trọng trường của một vật ở gần mặt đất được tính bằng công thức nào?",
            options: ["$W_t = \\frac{1}{2}mv^2$", "$W_t = P \\cdot h$", "$W_t = m \\cdot v$", "$W_t = P \\cdot v$"],
            correct: 1, explain: "Theo SGK KHTN 9 (Trang 16), thế năng trọng trường được tính bằng biểu thức: $W_t = P \\cdot h$ (trong đó P là trọng lượng, h là độ cao so với mốc)."
        },
        {
            type: 'MC', text: "Đơn vị đo của động năng và thế năng trong hệ SI là gì?",
            options: ["Newton (N)", "Mét (m)", "Joule (J)", "Kilôgam (kg)"],
            correct: 2, explain: "Cả động năng và thế năng đều là các dạng của năng lượng, nên đơn vị đo đều là Joule (J)."
        },
        {
            type: 'MC', text: "Trường hợp nào sau đây vật **CHỈ CÓ** thế năng đàn hồi (bỏ qua thế năng trọng trường)?",
            options: ["Nước trong hồ chứa của đập thủy điện.", "Mũi tên đang bay trên không trung.", "Dây cung đang bị kéo căng nằm ngang.", "Quả bóng đang rơi từ trên cao xuống."],
            correct: 2, explain: "Theo SGK (Trang 17), dây cung đang bị kéo căng có sự biến dạng đàn hồi nên dự trữ thế năng đàn hồi. Các trường hợp còn lại liên quan đến thế năng trọng trường hoặc động năng."
        },
        {
            type: 'MC', text: "Một ô tô đang chạy trên đường cao tốc. Tốc độ của ô tô thay đổi như thế nào nếu động năng của nó tăng gấp 4 lần (giữ nguyên khối lượng)?",
            options: ["Tốc độ tăng gấp 2 lần.", "Tốc độ tăng gấp 4 lần.", "Tốc độ giảm 2 lần.", "Tốc độ giảm 4 lần."],
            correct: 0, explain: "Vì $W_d = \\frac{1}{2}mv^2$. Động năng tỉ lệ thuận với BÌNH PHƯƠNG tốc độ. Do đó $W_d$ tăng 4 lần thì $v$ chỉ tăng $\\sqrt{4} = 2$ lần."
        },

        // DẠNG 2: ĐÚNG/SAI CỤM 4 Ý (TF_CLUSTER) - 5 Câu
        {
            type: 'TF_CLUSTER', text: "Xét một quả bóng đang rơi từ độ cao $h$ xuống mặt đất (chọn mặt đất làm gốc thế năng). Các phát biểu sau đúng hay sai?",
            statements: [
                { text: "Quả bóng có cả động năng và thế năng trọng trường.", correct: true },
                { text: "Trong quá trình rơi, động năng của quả bóng giảm dần.", correct: false },
                { text: "Ngay khi vừa chạm đất, thế năng của quả bóng bằng 0.", correct: true },
                { text: "Thế năng trọng trường của quả bóng luôn tỉ lệ nghịch với khối lượng của nó.", correct: false }
            ],
            explain: "A Đúng: Đang rơi có $v > 0$ và $h > 0$. B Sai: Rơi nhanh dần nên động năng tăng dần. C Đúng: Chạm gốc thế năng $h=0$ nên $W_t = 0$. D Sai: $W_t = Ph = mgh$, thế năng tỉ lệ thuận với khối lượng $m$, không phải tỉ lệ nghịch."
        },
        {
            type: 'TF_CLUSTER', text: "Dựa vào hình ảnh đập thủy điện (Hình 2.3 - SGK), đánh giá các nhận định về việc khai thác năng lượng nước:",
            statements: [
                { text: "Nước trong hồ chứa ở trên cao so với tuabin dự trữ một động năng rất lớn.", correct: false },
                { text: "Người ta thường bố trí tuabin máy phát điện càng thấp so với mực nước để tận dụng tối đa thế năng.", correct: true },
                { text: "Khi nước chảy từ trên cao xuống, thế năng của nước chuyển hóa thành động năng làm quay tuabin.", correct: true },
                { text: "Đại lượng $h$ trong công thức $W_t = Ph$ của đập nước không phụ thuộc vào vị trí đặt tuabin.", correct: false }
            ],
            explain: "A Sai: Nước đứng yên trong hồ dự trữ THẾ NĂNG, không phải động năng. B Đúng & C Đúng: SGK trang 16 giải thích nguyên lí đập thủy điện. D Sai: $h$ là độ cao so với gốc (thường chọn ngang tuabin), nên nó phụ thuộc vị trí đặt tuabin."
        },
        {
            type: 'TF_CLUSTER', text: "Phân tích đặc điểm của Động năng và Thế năng:",
            statements: [
                { text: "Hai vật có cùng khối lượng, vật nào chuyển động nhanh hơn thì có động năng lớn hơn.", correct: true },
                { text: "Giá trị của thế năng không bao giờ phụ thuộc vào vị trí chọn làm mốc.", correct: false },
                { text: "Động năng của một vật luôn là một đại lượng vô hướng và có giá trị lớn hơn hoặc bằng không.", correct: true },
                { text: "Mọi vật xung quanh ta dù đứng yên hay chuyển động đều có động năng.", correct: false }
            ],
            explain: "A Đúng: $W_d \\sim v^2$. B Sai: Thế năng phụ thuộc vào gốc chọn độ cao. C Đúng: Năng lượng vô hướng, $v^2 \\ge 0$ nên $W_d \\ge 0$. D Sai: Vật đứng yên ($v=0$) thì $W_d = 0$ (không có động năng)."
        },
        {
            type: 'TF_CLUSTER', text: "Một công nhân vác bao xi măng trọng lượng 500 N trên vai, đứng trên sân thượng tòa nhà cao 20 m so với mặt đất. Bao xi măng cách sân thượng 1,4 m. Phân tích các phát biểu:",
            statements: [
                { text: "Nếu chọn gốc thế năng tại mặt đất, thế năng của bao xi măng là $W_t = 10000$ J.", correct: false },
                { text: "Nếu chọn gốc thế năng tại mặt sân thượng, thế năng của bao xi măng là $W_t = 700$ J.", correct: true },
                { text: "Khối lượng của bao xi măng là $50$ kg (lấy $g \\approx 10 m/s^2$).", correct: true },
                { text: "Thế năng của bao xi măng hoàn toàn giống nhau bất kể công nhân đứng ở tầng mấy.", correct: false }
            ],
            explain: "A Sai: So với mặt đất, $h = 20 + 1,4 = 21,4$ m $\\rightarrow W_t = 500 \\times 21,4 = 10700$ J. B Đúng: So với sân thượng, $h = 1,4$ m $\\rightarrow W_t = 500 \\times 1,4 = 700$ J. C Đúng: $m = P/10 = 50$ kg. D Sai: Thế năng phụ thuộc độ cao $h$."
        },
        {
            type: 'TF_CLUSTER', text: "Xét các phát biểu về công thức Vật lí:",
            statements: [
                { text: "Biểu thức tính động năng là $W_d = mv^2$.", correct: false },
                { text: "Trong công thức $W_t = P \\cdot h$, $P$ là khối lượng của vật đo bằng kg.", correct: false },
                { text: "Trong công thức $W_t = P \\cdot h$, $h$ là độ cao so với vị trí được chọn làm gốc.", correct: true },
                { text: "1 Joule (J) có giá trị tương đương với $1 kg \\cdot m^2/s^2$.", correct: true }
            ],
            explain: "A Sai: Thiếu hệ số $\\frac{1}{2}$. B Sai: $P$ là trọng lượng (N), $m$ mới là khối lượng. C Đúng: SGK trang 16. D Đúng: Phân tích đơn vị từ $W_d = \\frac{1}{2}mv^2 \\rightarrow kg \\cdot (m/s)^2$."
        },

        // DẠNG 3: TRẢ LỜI NGẮN (SHORT_ANS) - 5 Câu
        {
            type: 'SHORT_ANS', text: "Tính động năng của quả bóng đá có khối lượng $m = 0,45$ kg, đang bay với tốc độ $v = 10$ m/s. (Nhập kết quả là số, đơn vị J).",
            correct: 22.5,
            explain: "Áp dụng công thức: $W_d = \\frac{1}{2}mv^2 = \\frac{1}{2} \\cdot 0,45 \\cdot 10^2 = 22,5$ (J)."
        },
        {
            type: 'SHORT_ANS', text: "Một vận động viên có khối lượng $m = 60$ kg đang chạy với tốc độ $v = 5$ m/s. Động năng của người này là bao nhiêu J?",
            correct: 750,
            explain: "$W_d = \\frac{1}{2} \\cdot 60 \\cdot 5^2 = 30 \\cdot 25 = 750$ (J)."
        },
        {
            type: 'SHORT_ANS', text: "Một chiếc tủ lạnh có trọng lượng $P = 800$ N được đưa lên xe tải cách mặt đất $h = 1,2$ m. Tính thế năng trọng trường của tủ lạnh so với mặt đất (J).",
            correct: 960,
            explain: "Áp dụng công thức: $W_t = P \\cdot h = 800 \\cdot 1,2 = 960$ (J)."
        },
        {
            type: 'SHORT_ANS', text: "So sánh thế năng trọng trường của hai vật ở cùng một độ cao so với gốc thế năng. Khối lượng vật 1 gấp 3 lần vật 2. Lập tỉ số $\\frac{W_{t1}}{W_{t2}}$?",
            correct: 3,
            explain: "$W_t = P \\cdot h = 10m \\cdot h$. Vì $h$ giống nhau, thế năng tỉ lệ thuận với khối lượng. $m_1 = 3m_2 \\rightarrow W_{t1} = 3W_{t2}$."
        },
        {
            type: 'SHORT_ANS', text: "Một vật có động năng $W_d = 100$ J đang di chuyển với tốc độ $v = 10$ m/s. Tính khối lượng $m$ của vật (đơn vị kg).",
            correct: 2,
            explain: "Từ $W_d = \\frac{1}{2}mv^2 \\rightarrow 100 = \\frac{1}{2} \\cdot m \\cdot 10^2 \\rightarrow 100 = 50m \\rightarrow m = 2$ (kg)."
        },

        // DẠNG 4: GHÉP NỐI (MATCH) - 5 Câu
        {
            type: 'MATCH', text: "Ghép nối các đại lượng Vật lí với biểu thức/đơn vị tương ứng:",
            pairs: [
                { left: "Động năng ($W_d$)", right: "$\\frac{1}{2}mv^2$" },
                { left: "Thế năng trọng trường ($W_t$)", right: "$P \\cdot h$" },
                { left: "Khối lượng vật ($m$)", right: "Kilôgam (kg)" },
                { left: "Trọng lượng vật ($P$)", right: "Newton (N)" }
            ],
            explain: "Dựa vào SGK Trang 16, các kí hiệu chuẩn là: $W_d$ (J) tính bằng nửa tích m và v bình; $W_t$ (J) tính bằng P nhân h; m (kg); P (N)."
        },
        {
            type: 'MATCH', text: "Ghép nối các hiện tượng đời sống với loại năng lượng mà vật đang có (chọn gốc thế năng tại mặt đất):",
            pairs: [
                { left: "Chiếc búa máy đang rơi xuống cọc", right: "Có cả động năng và thế năng" },
                { left: "Cây cung đang bị kéo căng nằm yên", right: "Thế năng đàn hồi" },
                { left: "Quả bóng bowling lăn trên sàn phẳng", right: "Chỉ có động năng" },
                { left: "Quyển sách nằm yên trên nóc tủ", right: "Chỉ có thế năng trọng trường" }
            ],
            explain: "Rơi: đang chuyển động và ở trên cao. Kéo căng: đàn hồi. Lăn trên sàn (gốc TN): $h=0 \\rightarrow W_t = 0$. Nằm yên trên cao: $v=0 \\rightarrow W_d = 0$."
        },
        {
            type: 'MATCH', text: "Ghép yếu tố thay đổi với sự thay đổi của Động năng tương ứng (Khối lượng không đổi):",
            pairs: [
                { left: "Tốc độ giảm đi một nửa", right: "Động năng giảm 4 lần" },
                { left: "Tốc độ tăng gấp 3", right: "Động năng tăng 9 lần" },
                { left: "Tốc độ không đổi", right: "Động năng không đổi" },
                { left: "Tốc độ giảm còn một phần ba", right: "Động năng giảm 9 lần" }
            ],
            explain: "Động năng tỉ lệ với BÌNH PHƯƠNG tốc độ. Vận tốc biến thiên k lần thì động năng biến thiên $k^2$ lần."
        },
        {
            type: 'MATCH', text: "Ghép các kí hiệu trong biểu thức Vật lí với ý nghĩa của nó:",
            pairs: [
                { left: "Kí hiệu $v$", right: "Tốc độ của vật" },

    const shuffleArray = (arr) => arr.map(a => ({sort: Math.random(), value: a})).sort((a, b) => a.sort - b.sort).map(a => a.value);
    
    const playSound = (isSuccess) => {
        try {
            Tone.start();
            const synth = new Tone.Synth().toDestination();
            if (isSuccess) synth.triggerAttackRelease("C5", "8n");
            else synth.triggerAttackRelease("C3", "8n");
        } catch (e) { console.log('Audio error ignored'); }
    };

    const initQuiz = () => {
        let qs = JSON.parse(JSON.stringify(rawQuestions));
        qs = shuffleArray(qs).map((q, idx) => {
            q.displayId = idx + 1;
            if (q.type === 'MC') {
                const correctAnswerStr = q.options[q.correct];
                q.options = shuffleArray(q.options);
                q.correct = q.options.indexOf(correctAnswerStr);
            }
            if (q.type === 'MATCH') {
                q.lefts = shuffleArray(q.pairs.map((p, i) => ({text: p.left, id: i})));
                q.rights = shuffleArray(q.pairs.map((p, i) => ({text: p.right, id: i})));
                AppState.matchPairsState[q.displayId] = { selectedLeft: null, selectedRight: null, pairs: [] };
            }
            if (q.type === 'FILL_BLANK') {
                q.words = shuffleArray(q.words); 
                AppState.fillBlankState[q.displayId] = { selectedWord: null, blanks: {} };
            }
            return q;
        });
        AppState.questions = qs;
        AppState.answers = {};
        AppState.timeLeft = 600;
        AppState.status = 'QUIZ';
        AppState.currentActiveQId = 1;
        
        AppState.timerInt = setInterval(() => {
            AppState.timeLeft--;
            renderTimer();
            if (AppState.timeLeft <= 0) {
                clearInterval(AppState.timerInt);
                submitExam(true); // Gửi thêm cờ timeout = true
            }
        }, 1000);
        
        App.render();
        safeMathJax();
    };

                }
                else if (q.type === 'FILL_BLANK') {
                    let text = q.text;
                    const st = AppState.fillBlankState[q.displayId];
                    Object.keys(q.correct).forEach(k => {
                        const filledVal = st.blanks[k];
                        const cls = filledVal ? 'bg-blue-100 border-blue-500 text-blue-800 shadow-inner' : 'bg-white border-dashed border-gray-400 text-gray-400';
                        const blankHtml = `<span class="blank-slot text-base font-bold shadow-sm ${cls}" onclick="${isRes ? '' : `App.clickBlank(${q.displayId}, '${k}')`}">${filledVal || '?'}</span>`;
                        text = text.replace(`[${k}]`, blankHtml);
                    });
                    html += `<div class="text-xl leading-loose bg-gray-50 p-6 md:p-8 rounded-xl mb-6 border-2 border-gray-200 text-gray-800 font-medium">${text}</div>`;
                    
                    if (!isRes) {
                        html += `<div class="mt-6 pt-6 border-t-2 border-dashed border-gray-200">
                            <p class="text-sm font-black text-gray-400 mb-4 tracking-widest uppercase text-center">Danh sách từ gợi ý (Chạm để chọn trước)</p>

                            if(isUsed) cls += 'used bg-gray-100 text-gray-400 border-gray-200 shadow-none ';

                            else cls += 'bg-white text-gray-700 border-gray-300 shadow-sm hover:border-blue-400 hover:text-blue-600 ';
                            const escapedW = w.replace(/'/g, "\\'");
                            html += `<div class="${cls}" onclick="App.clickWord(${q.displayId}, '${escapedW}')">${w}</div>`;
                        });
                        html += `</div></div>`;
                    }
                }

                html += `</div>`; // end space-y-3

                // HIỂN THỊ KẾT QUẢ KHI RESULT
                if (isRes) {

                    const isZero = rs.score === 0;

    const getScoreForQuestion = (q) => {
        let s = 0; let m = 1;
        const a = AppState.answers[q.displayId];
        
        if (q.type === 'MC' && a === q.correct) s = 1;
        
        if (q.type === 'TF_CLUSTER') {
            if (a) {
                let count = 0;
                q.statements.forEach((stmt, i) => { if (a[i] === stmt.correct) count++; });
                if (count === 1) s = 0.1;
                else if (count === 2) s = 0.25;
                else if (count === 3) s = 0.5;
                else if (count === 4) s = 1.0;
            }
        }
        
        if (q.type === 'SHORT_ANS' && a !== undefined && a !== '') {
            let userStr = a.toString().trim().replace(',', '.');
            let userVal = parseFloat(userStr);
            if (!isNaN(userVal) && userVal === q.correct) s = 1;
        }

        if (q.type === 'MATCH') {
            const st = AppState.matchPairsState[q.displayId];
            if (st && st.pairs.length === 4) { 
                let correctCount = 0;
                st.pairs.forEach(p => {
                    const leftId = p.left;
                    const rightId = p.right;
                    if (leftId === rightId) correctCount++; 
                });
                if (correctCount === 4) s = 1;
            }
        }

        if (q.type === 'FILL_BLANK') {
            const st = AppState.fillBlankState[q.displayId];
            if (st) {
                let isAllCorrect = true;
                Object.keys(q.correct).forEach(k => {
                    if (st.blanks[k] !== q.correct[k]) isAllCorrect = false;
                });
                if (isAllCorrect && Object.keys(st.blanks).length === Object.keys(q.correct).length) s = 1;
            }
        }

        return { score: s, max: m };
    };

    const submitExam = (isTimeout = false) => {
        if(AppState.timerInt) clearInterval(AppState.timerInt);
        AppState.status = 'RESULT';
        
        let total = 0;
        AppState.questions.forEach(q => total += getScoreForQuestion(q).score);
        
        let db = JSON.parse(localStorage.getItem('khtn9_scores') || '[]');
        const timeUsed = isTimeout ? 600 : (600 - AppState.timeLeft);
        const entry = {
            key: `${AppState.user.type}_${AppState.user.id}`,
            type: AppState.user.type,
            id: AppState.user.id,
            name: AppState.user.name,
            score: total,
            time: timeUsed,
            date: new Date().toISOString()
        };
        
        const existIdx = db.findIndex(d => d.key === entry.key);
        if (existIdx > -1) db[existIdx] = entry; 
        else db.push(entry);
        
        localStorage.setItem('khtn9_scores', JSON.stringify(db));
        App.render();
        safeMathJax();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

                },
                true,
                `<input type="password" id="modal-inp-pass" class="w-full border-2 border-gray-300 p-4 rounded-xl outline-none focus:border-blue-500 text-center font-bold tracking-widest text-xl shadow-inner" placeholder="***">`
            );
        },
        switchAdminTab: (tab) => {
            AppState.adminTab = tab;
            App.refreshAdmin(); 
        },
        refreshAdmin: () => {
            App.render(); 
            if (AppState.adminTab === 'EXAM') safeMathJax();
        },
        goHome: () => {
            if(AppState.timerInt) clearInterval(AppState.timerInt);
            AppState.status = 'LOGIN';
            App.render();
        },

        setCurrentQ: (qId) => {
            AppState.currentActiveQId = qId;
            App.render();
            safeMathJax();
        },

        saveAns: (qId, val) => {
            const q = AppState.questions.find(x => x.displayId === qId);
            if (q.type === 'TF_CLUSTER') {
                if(!AppState.answers[qId]) AppState.answers[qId] = {};
                AppState.answers[qId][val.idx] = val.val;
                if(Object.keys(AppState.answers[qId]).length === 4) App.updateNav(qId);
            } else {
                AppState.answers[qId] = val;
                App.updateNav(qId);
            }
        },
        updateNav: (qId) => {
            AppState.currentActiveQId = qId;
            App.render();
            safeMathJax();
        },

        clickMatchLeft: (qId, lId) => {
            let st = AppState.matchPairsState[qId];
            if(st.pairs.find(p => p.left === lId)) return;
            st.selectedLeft = lId;
            App.checkMatch(qId);
            App.updateNav(qId); 
        },
        clickMatchRight: (qId, rId) => {
            let st = AppState.matchPairsState[qId];
            if(st.pairs.find(p => p.right === rId)) return;
            st.selectedRight = rId;
            App.checkMatch(qId);
            App.updateNav(qId);
        },
        checkMatch: (qId) => {
            let st = AppState.matchPairsState[qId];
            if(st.selectedLeft !== null && st.selectedRight !== null) {
                st.pairs.push({left: st.selectedLeft, right: st.selectedRight});
                st.selectedLeft = null;
                st.selectedRight = null;
                if(st.pairs.length === 4) { AppState.answers[qId] = true; }
            }
        },
        clearMatch: (qId) => {
            AppState.matchPairsState[qId] = { selectedLeft: null, selectedRight: null, pairs: [] };
            delete AppState.answers[qId];
            App.updateNav(qId);
        },

        clickWord: (qId, word) => {
            AppState.fillBlankState[qId].selectedWord = word;
            App.updateNav(qId);
        },
        clickBlank: (qId, blankKey) => {
            let st = AppState.fillBlankState[qId];
            if (st.blanks[blankKey]) {
                delete st.blanks[blankKey];
            } else if (st.selectedWord) {
                st.blanks[blankKey] = st.selectedWord;
                st.selectedWord = null;
            }
            
            const q = AppState.questions.find(x => x.displayId === qId);
            if(Object.keys(st.blanks).length === Object.keys(q.correct).length) {
                AppState.answers[qId] = true;
            } else {
                delete AppState.answers[qId];
            }
            App.updateNav(qId);
        },

        askSubmit: () => {
            let answeredCount = Object.keys(AppState.answers).length;
            let totalCount = AppState.questions.length;
            let msg = answeredCount < totalCount 
                ? `Bạn mới làm ${answeredCount}/${totalCount} câu. Những câu chưa làm sẽ bị tính 0 điểm. Bạn có chắc chắn muốn nộp bài sớm?` 
                : `Bạn đã hoàn thành đủ ${totalCount} câu hỏi. Xác nhận nộp bài?`;

            MODAL.show('Xác Nhận Nộp Bài', msg, () => {
                MODAL.hide();
                submitExam(false); 
            }, true);
        }
    };

    App.render();

</script>
</body>
</html>
